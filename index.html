  for (var i = 0; i < prevUnits.length; i++) {
    var prev = unitApprovedResults_(prevUnits[i]);
    if (!prev.length) continue;
    var pv = averageValues_(prev);
    NUTRIENTS.forEach(function (n) {
      var ch = (values[n.f] - pv[n.f]) / pv[n.f] * 100;
      if (Math.abs(ch) >= 25) out.push({ type: 'YEAR_OVER_YEAR', nutrient: n.k, message: n.k + ' berubah ' + (ch > 0 ? '+' : '') + Math.round(ch) + '% dibanding ' + prevUnits[i].targetYear + ' (' + pv[n.f] + ' → ' + values[n.f] + ' ' + n.unit + ').' });
    });
    break;
  }
  // 2) inkonsisten dengan umur tanaman (TBM dengan N sangat rendah/tinggi)
  var b = byId_('Blocks', unit.blockIds[0]);
  if (b && ageClass_(b, unit.targetYear, activeProtocol_()) === 'TBM') out.push({ type: 'AGE_CLASS', nutrient: '-', message: 'Unit berisi tanaman TBM (pelepah 9): ambang hara TM bersifat indikatif.' });
  // 3) deviasi antar unit lain di estate yang sama, tahun yang sama
  var peers = all_('LsuUnits').filter(function (u) { return u.id !== unit.id && u.estateId === unit.estateId && u.targetYear === unit.targetYear; });
  var peerVals = [];
  peers.forEach(function (u) { var rs = unitApprovedResults_(u); if (rs.length) peerVals.push(averageValues_(rs)); });
  if (peerVals.length >= 2) {
    NUTRIENTS.forEach(function (n) {
      var arr = peerVals.map(function (v) { return v[n.f]; });
      var mean = arr.reduce(function (a, c) { return a + c; }, 0) / arr.length;
      var sd = Math.sqrt(arr.reduce(function (a, c) { return a + (c - mean) * (c - mean); }, 0) / arr.length) || mean * 0.05;
      var z = (values[n.f] - mean) / sd;
      if (Math.abs(z) >= 2.5) out.push({ type: 'PEER_DEVIATION', nutrient: n.k, message: n.k + ' menyimpang ' + z.toFixed(1) + ' SD dari rata-rata unit lain di estate (' + mean.toFixed(3) + ' ' + n.unit + ').' });
    });
  }
  return out;
}

function price_(code) {
  var p = find_('FertPrices', function (x) { return x.code === code; });

/** Dosis (kg/pokok/tahun) per kelas umur & status hara. TBM = 60% dosis TM. */
function doseTable_(values, ageCls) {
  var f = ageCls === 'TBM' ? 0.6 : 1;
  function pick(v, n, d) { return v < n.acute ? d[0] : (v < n.low ? d[1] : d[2]); }
  var N = NUTRIENTS, items = [];
  items.push({ code: 'UREA', dose: pick(values.nitrogenPercent, N[0], [2.75, 2.50, 2.00]), sem: 0, target: '46% N' });
  items.push({ code: 'RP', dose: pick(values.phosphorusPercent, N[1], [2.00, 1.75, 1.25]), sem: 1, target: '28% P2O5' });
  items.push({ code: 'MOP', dose: pick(values.potassiumPercent, N[2], [2.75, 2.25, 2.00]), sem: 0, target: '60% K2O' });
  items.push({ code: 'KIES', dose: pick(values.magnesiumPercent, N[3], [1.75, 1.50, 1.00]), sem: 2, target: '27% MgO' });
  if (values.calciumPercent < N[4].low) items.push({ code: 'DOLO', dose: values.calciumPercent < N[4].acute ? 1.50 : 1.00, sem: 1, target: '30% CaO' });
  items.push({ code: 'BOR', dose: pick(values.boronPpm, N[5], [0.15, 0.10, 0.05]), sem: 1, target: '48% B2O3' });
  if (values.copperPpm < N[6].low) items.push({ code: 'CUSO4', dose: values.copperPpm < N[6].acute ? 0.10 : 0.05, sem: 1, target: '25% Cu' });
  if (values.zincPpm < N[7].low) items.push({ code: 'ZNSO4', dose: values.zincPpm < N[7].acute ? 0.10 : 0.05, sem: 1, target: '22-35% Zn' });
  // K/Mg antagonisme: naikkan Kieserite satu tingkat
  if (values.potassiumPercent / values.magnesiumPercent > 3.5) items.forEach(function (it) { if (it.code === 'KIES') it.dose = Math.min(2.0, it.dose + 0.25); });
  items.forEach(function (it) { it.dose = Math.round(it.dose * f * 100) / 100; });
  return items;
}

function updateRecItem_(actor, p) {

var REC_FLOW = {

  REVIEWED_BY_AGRONOMIST: { APPROVED_BY_VP: ['HEAD_AGRONOMY'], REJECTED: ['HEAD_AGRONOMY'] },

function recommendationStatus_(actor, p) {
  var rec = byId_('Recommendations', p.id);
  if (!rec) throw appError_('NOT_FOUND', 'Rekomendasi tidak ditemukan.');
  requireEstate_(actor, rec.estateId);
  var to = p.status, rule = (REC_FLOW[rec.status] || {})[to];
  if (!rule) throw appError_('INVALID_STATUS_TRANSITION', 'Transisi ' + rec.status + ' → ' + to + ' tidak diizinkan. Alur: DRAFT → REVIEWED_BY_AGRONOMIST → APPROVED_BY_VP → RELEASED_TO_ESTATE.');
  requireRole_(actor, rule);
  var now = nowIso_(), patch = { status: to, updatedAt: now };
  if (to === 'REJECTED') { if (!String(p.reason || '').trim()) throw appError_('REASON_REQUIRED', 'Alasan penolakan wajib diisi.'); patch.rejectionReason = p.reason; }
  if (to === 'REVIEWED_BY_AGRONOMIST') { patch.reviewedById = actor.id; if (p.notes) patch.agronomistNotes = rec.agronomistNotes + ' | Catatan review: ' + p.notes; }
  if (to === 'APPROVED_BY_VP') {
    if (rec.reviewedById === actor.id && actor.role !== 'SUPER_ADMIN') throw appError_('SEGREGATION_OF_DUTY', 'Penyetuju harus berbeda dengan pereview (prinsip 4 mata).', 403);
    patch.approvedById = actor.id; patch.approvedAt = now;
  }
  if (to === 'RELEASED_TO_ESTATE') patch.releasedAt = now;
  var prev = rec.status;
  update_('Recommendations', rec, patch);
  insert_('Approvals', { id: newId_('apv'), targetEntityType: 'RECOMMENDATION', targetEntityId: rec.id, level: to, approverUserId: actor.id, approverRole: actor.role, decision: to === 'REJECTED' ? 'REJECTED' : 'APPROVED', reason: p.reason || '', decidedAt: now });
  audit_('RECOMMENDATION_STATUS_TRANSITION', 'RECOMMENDATION', rec.id, actor, { recCode: rec.recCode, from: prev, to: to }, rec.estateId);
  if (to === 'REVIEWED_BY_AGRONOMIST') notifyRoles_(['HEAD_AGRONOMY'], rec.estateId, 'Rekomendasi pupuk ' + rec.recCode + ' menunggu persetujuan Kepala Agronomi.');

  return clean_(rec);
}

/* =================== Lisensi (tanda tangan RSA, diverifikasi dengan BigInt) ===================
 * Kunci lisensi = base64url(JSON payload) + "." + base64url(RSA-SHA256 signature)
 * Penyedia menandatangani dengan PRIVATE KEY (Generator-Lisensi.html, folder PENYEDIA).
 * Kode klien hanya memuat PUBLIC KEY → klien tidak dapat membuat lisensi sendiri.
 * GANTI LICENSE_PUBLIC_N dengan modulus milik Anda (lihat Panduan Penyedia).
 */
var LICENSE_PUBLIC_N = 'd2d2868a1915b97d7e5716c5a7788dc979454a3c837507694119efecef844ba6d2266124302a4f778177096b00a1748ed839cdf43de870dd17773f417135bf48fb0919d51aa4d209190efec0f7bb1b489fab7e965156c69313be41a8fdbfaa7cc86697be95c85623cc6b3c0bb0a6e1615c6d97688fb9fc6cb246122e608ecbc00f26224d370f12e027daf306068610a91a012bfff86d2ccdce721670f6f8513f1ab60772d816ab234f53452904b2f4b91d3a66ee791acd5fa28f0ade3bc9fec2cf3967a54b8af055e0e71577ae8c473a4bd7306e7e36b0e36a8e1a7440152f3f06563e74577f79ff933b647108e342d7012497211fcd395837377ef27c97c9c5';
var LICENSE_PUBLIC_E = 65537;
var TRIAL_DAYS = 30;
var TIER_DEFAULTS = {
  TRIAL:      { maxUsers: 10,   maxEstates: 2,   features: ['pmtiles', 'reco', 'wa', 'export'] },
  BASIC:      { maxUsers: 15,   maxEstates: 2,   features: ['export'] },
  PRO:        { maxUsers: 60,   maxEstates: 10,  features: ['pmtiles', 'reco', 'export'] },
  ENTERPRISE: { maxUsers: 9999, maxEstates: 999, features: ['pmtiles', 'reco', 'wa', 'export'] }
};

function bytesToBigInt_(bytes) {
  var hex = '';
  for (var i = 0; i < bytes.length; i++) hex += ('0' + (bytes[i] & 0xff).toString(16)).slice(-2);
  return BigInt('0x' + (hex || '0'));
}

function modPow_(base, exp, mod) {
  var result = BigInt(1), b = base % mod, e = exp;
  var zero = BigInt(0), one = BigInt(1), two = BigInt(2);
  while (e > zero) {
    if (e % two === one) result = (result * b) % mod;
    e = e / two;
    b = (b * b) % mod;
  }
  return result;
}

function rsaVerify_(message, sigB64u) {
  if (!LICENSE_PUBLIC_N || LICENSE_PUBLIC_N.indexOf('__') === 0) return false;
  var n = BigInt('0x' + LICENSE_PUBLIC_N);
  var k = LICENSE_PUBLIC_N.length / 2;
  var sig = bytesToBigInt_(Utilities.base64DecodeWebSafe(sigB64u));
  if (sig >= n) return false;
  var m = modPow_(sig, BigInt(LICENSE_PUBLIC_E), n).toString(16);
  while (m.length < k * 2) m = '0' + m;
  var hash = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, message, Utilities.Charset.UTF_8);
  var hHex = hash.map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');
  var tail = '003031300d060960864801650304020105000420' + hHex;
  var ps = '';
  for (var i = 0; i < k * 2 - 4 - tail.length; i += 2) ps += 'ff';
  return m === '0001' + ps + tail;
}

function parseLicense_(key) {
  var parts = String(key || '').trim().split('.');
  if (parts.length !== 2) return { valid: false, reason: 'Format kunci lisensi tidak valid.' };
  if (!rsaVerify_(parts[0], parts[1])) return { valid: false, reason: 'Tanda tangan lisensi tidak sah.' };
  var json;
  try { json = JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(parts[0])).getDataAsString()); } catch (e) { return { valid: false, reason: 'Isi lisensi rusak.' }; }
  return { valid: true, payload: json };
}

function spreadsheetId_() { try { return ss_().getId(); } catch (e) { return ''; } }

function licenseStatus_() {
  if (MEMO_.license) return MEMO_.license;
  var props = PropertiesService.getScriptProperties();
  var key = props.getProperty('LICENSE_KEY');
  var st;
  if (key) {
    var lic = null, ck = 'LIC:' + key.slice(-24);
    try { var cv = CacheService.getScriptCache().get(ck); if (cv) lic = JSON.parse(cv); } catch (e) { }
    if (!lic) { lic = parseLicense_(key); try { CacheService.getScriptCache().put(ck, JSON.stringify(lic), 3600); } catch (e) { } }
    if (lic.valid) {
      var pl = lic.payload, def = TIER_DEFAULTS[pl.t] || TIER_DEFAULTS.BASIC;
      var bound = !pl.sid || pl.sid === '*' || pl.sid === spreadsheetId_();
      var daysLeft = Math.ceil((new Date(pl.exp + 'T23:59:59+07:00').getTime() - Date.now()) / 864e5);
      st = { tier: pl.t, client: pl.c, licenseId: pl.id || '', expiresAt: pl.exp, daysLeft: daysLeft, maxUsers: pl.u || def.maxUsers, maxEstates: pl.e || def.maxEstates, features: pl.f || def.features, valid: bound && daysLeft >= 0, reason: !bound ? 'Lisensi terikat ke spreadsheet lain.' : (daysLeft < 0 ? 'Lisensi kedaluwarsa pada ' + pl.exp + '.' : '') };
    } else st = { tier: 'INVALID', valid: false, reason: lic.reason, maxUsers: 1, maxEstates: 1, features: [], daysLeft: 0 };
  } else {
    var inst = props.getProperty('INSTALLED_AT');
    if (!inst) { inst = nowIso_(); props.setProperty('INSTALLED_AT', inst); }
    var left = TRIAL_DAYS - Math.floor((Date.now() - new Date(inst).getTime()) / 864e5);
    var d = TIER_DEFAULTS.TRIAL;
    st = { tier: 'TRIAL', client: 'Uji Coba', expiresAt: new Date(new Date(inst).getTime() + TRIAL_DAYS * 864e5).toISOString().substring(0, 10), daysLeft: left, maxUsers: d.maxUsers, maxEstates: d.maxEstates, features: d.features, valid: left >= 0, reason: left < 0 ? 'Masa uji coba ' + TRIAL_DAYS + ' hari telah berakhir.' : '' };
  }
  st.spreadsheetId = spreadsheetId_();
  MEMO_.license = st;
  return st;
}

function activateLicense_(actor, p) {
  requireRole_(actor, ['SUPER_ADMIN']);
  var lic = parseLicense_(p.key);
  if (!lic.valid) throw appError_('LICENSE_INVALID', lic.reason);
  if (lic.payload.sid && lic.payload.sid !== '*' && lic.payload.sid !== spreadsheetId_()) throw appError_('LICENSE_INVALID', 'Lisensi ini diterbitkan untuk spreadsheet lain (ID ' + lic.payload.sid + ').');
  PropertiesService.getScriptProperties().setProperty('LICENSE_KEY', String(p.key).trim());
  delete MEMO_.license;
  audit_('LICENSE_ACTIVATED', 'LICENSE', lic.payload.id || '', actor, { tier: lic.payload.t, exp: lic.payload.exp, client: lic.payload.c });
  return licenseStatus_();
}

function hasFeature_(f) { var st = licenseStatus_(); return st.valid && (st.features || []).indexOf(f) >= 0; }

function requireFeature_(f, label) {
  if (!hasFeature_(f)) throw appError_('LICENSE_FEATURE', 'Fitur ' + label + ' tidak termasuk paket lisensi ' + licenseStatus_().tier + '. Hubungi penyedia untuk upgrade.', 402);
}

function enforceLicenseLimit_(what) {
  var st = licenseStatus_();
  if (what === 'users') {
    var n = all_('Users').filter(function (u) { return u.isActive; }).length;
    if (n >= st.maxUsers) throw appError_('LICENSE_LIMIT', 'Batas pengguna aktif paket ' + st.tier + ' (' + st.maxUsers + ') tercapai.', 402);
  }
  if (what === 'estates') {
    var e = all_('Estates').filter(function (x) { return x.isActive; }).length;
    if (e >= st.maxEstates) throw appError_('LICENSE_LIMIT', 'Batas estate paket ' + st.tier + ' (' + st.maxEstates + ') tercapai.', 402);
  }
}

/* =================== Notifikasi WhatsApp (Fonnte, opsional) =================== */

function waEnabled_() { return getSetting_('WA_ENABLED', 'FALSE') === 'TRUE' && hasFeature_('wa') && !!PropertiesService.getScriptProperties().getProperty('FONNTE_TOKEN'); }

function sendWa_(phone, message) {
  if (!waEnabled_() || !phone) return false;
  try {
    var res = UrlFetchApp.fetch('https://api.fonnte.com/send', {
      method: 'post', muteHttpExceptions: true,
      headers: { Authorization: PropertiesService.getScriptProperties().getProperty('FONNTE_TOKEN') },
      payload: { target: String(phone).replace(/^\+/, ''), message: '[' + getSetting_('APP_TITLE', 'LSU') + '] ' + message }
    });
    return res.getResponseCode() === 200;
  } catch (e) { return false; }
}

function notifyUser_(user, message) { if (user && user.phone && user.waConsent) sendWa_(user.phone, message); }

function notifyRoles_(roles, estateId, message) {
  if (!waEnabled_()) return;
  all_('Users').filter(function (u) { return u.isActive && u.waConsent && roles.indexOf(u.role) >= 0 && (!estateId || canAccessEstate_(u, estateId)); }).slice(0, 10).forEach(function (u) { sendWa_(u.phone, message); });
}

function acceptLegal_(actor, p) {

  if (detail.length < 5) throw appError_('VALIDATION', 'Jelaskan permohonan Anda (minimal 5 karakter).');
  var r = insert_('DataRequests', { id: newId_('dsr'), userId: actor.id, userName: actor.fullName, type: p.type, detail: detail.substring(0, 2000), status: 'BARU', response: '', handledBy: '', handledAt: '', createdAt: nowIso_() });

  audit_('PRIVACY_REQUEST_CREATED', 'DATA_REQUEST', r.id, actor, { type: p.type });
  all_('Users').filter(function (u) { return u.isActive && u.role === 'SUPER_ADMIN' && u.waConsent; }).slice(0, 3).forEach(function (u) { sendWa_(u.phone, 'Permohonan data pribadi baru (' + DATA_REQUEST_TYPES[p.type] + ') dari ' + actor.fullName + '. Tindak lanjuti di menu Administrasi → Privasi.'); });

  update_('DataRequests', r, { status: p.status, response: String(p.response || '').substring(0, 2000), handledBy: actor.fullName, handledAt: nowIso_() });

/** Titik masuk tunggal: dipakai doPost (PWA GitHub Pages) dan google.script.run (mode Apps Script) */
function api(req) {
  MEMO_ = {}; SS_ = null;
  var lock = null;
  try {
    req = typeof req === 'string' ? JSON.parse(req) : (req || {});
    var route = ROUTES[req.action];
    if (!route) throw appError_('UNKNOWN_ACTION', 'Aksi API tidak dikenal: ' + req.action, 404);
    if (!schemaOk_()) migrateAll_();
    var ctx = { token: req.token || '', ua: req.ua || '' };
    var actor = route.auth === false ? null : sessionUser_(ctx.token);
    if (actor && actor.mustChangePw && ['auth.changePassword', 'auth.me', 'auth.logout', 'branding.get', 'ping'].indexOf(req.action) < 0) {
      throw appError_('PASSWORD_CHANGE_REQUIRED', 'Anda wajib mengganti password sebelum melanjutkan.', 403);
    }
    if (actor && needLegal_(actor) && ['auth.changePassword', 'auth.me', 'auth.logout', 'branding.get', 'ping', 'legal.info', 'legal.accept'].indexOf(req.action) < 0) {
      throw appError_('LEGAL_ACCEPT_REQUIRED', 'Silakan baca dan setujui Syarat & Ketentuan serta Pemberitahuan Privasi versi ' + LEGAL_VERSION + ' sebelum melanjutkan.', 403);
    }
    if (!route.ro) {
      var lic = licenseStatus_();
      if (!lic.valid) throw appError_('LICENSE_EXPIRED', 'Mode baca-saja: ' + lic.reason + ' Hubungi penyedia untuk aktivasi lisensi.', 402);
    }
    if (route.lock) { lock = LockService.getScriptLock(); lock.waitLock(25000); }
    var data = route.fn(actor, req.payload || {}, ctx);
    if (route.lock && req.action !== 'auth.login') bumpDataVer_(); // cache app.load otomatis kedaluwarsa
    return { ok: true, data: data };
  } catch (e) {
    if (!e.code) console.error('[LSU API ERROR] ' + (req && req.action) + ': ' + (e.stack || e));
    return { ok: false, error: { code: e.code || 'INTERNAL_ERROR', message: e.code ? e.message : ('Kesalahan server: ' + e.message), status: e.status || 500 } };
  } finally {
    if (lock) { try { lock.releaseLock(); } catch (x) { } }
  }
}

function doPost(e) {
  var body = e && e.postData ? e.postData.contents : '{}';
  var out = api(body);
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  if (e && e.parameter && e.parameter.api) {
    var out = api({ action: e.parameter.api });
    return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
  }
  var title = 'LSU Enterprise Platform';
  try { title = getSetting_('APP_TITLE', title); } catch (x) { }
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle(title)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

/* ---------------- API ---------------- */
function api(action, payload, opt) {
  opt = opt || {};
  var req = { action: action, payload: payload || {}, token: S.token, ua: navigator.userAgent.slice(0, 120) };
  if (!opt.silent) busy(true);
  var p;
  if (IS_GAS) {
    p = new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej({ code: 'NETWORK', message: (e && e.message) || 'Gagal menghubungi server.' }); }).api(req); });
  } else {
    var url = apiUrl();
    if (!url) { if (!opt.silent) busy(false); return Promise.reject({ code: 'NO_API_URL', message: 'URL Web App belum diatur. Klik ⚙ di halaman login.' }); }
    p = fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw { code: 'HTTP_' + r.status, message: 'Server merespons ' + r.status }; return r.json(); })
      .catch(function (e) { if (e && e.code) throw e; throw { code: 'NETWORK', message: 'Tidak dapat terhubung ke server (offline / URL salah).' }; });
  }
  return p.then(function (r) {
    if (!opt.silent) busy(false);
    if (!r || !r.ok) {
      var err = (r && r.error) || { code: 'UNKNOWN', message: 'Respons tidak valid' };
      if (err.code === 'UNAUTHORIZED' && action !== 'auth.login') { logoutLocal(); toast(err.message, 'bad'); }
      if (err.code === 'PASSWORD_CHANGE_REQUIRED') forcePasswordChange();
      if (err.code === 'LEGAL_ACCEPT_REQUIRED') legalGate(function () { loadData(); });
      throw err;
    }
    return r.data;
  }, function (e) { if (!opt.silent) busy(false); throw e; });
}

/* ---------------- Outbox offline (survei) ---------------- */
function queueSurvey(payload) {
  var item = { id: uid('ob'), idempotencyKey: uid('idem'), action: 'survey.sync', payload: payload, status: 'PENDING', retry: 0, createdAt: new Date().toISOString(), error: '' };

function refreshOutbox() { return IDB.all('outbox').then(function (l) { S.outbox = l.length; S.outboxItems = l; renderNet(); return l; }).catch(function () { return []; }); }
var syncing = false;
function syncOutbox(manual) {
  if (syncing || !S.token) return Promise.resolve();
  if (!navigator.onLine) { if (manual) toast('Perangkat offline. Data tetap aman di antrean.', 'bad'); return Promise.resolve(); }
  syncing = true;
  return IDB.all('outbox').then(function (items) {
    items = items.filter(function (i) { return manual || !i.nextAt || i.nextAt < Date.now(); });
    var chain = Promise.resolve(), okN = 0, rej = 0, okP = 0;
    items.forEach(function (it) {
      chain = chain.then(function () {
        var pl = Object.assign({}, it.payload, { idempotencyKey: it.idempotencyKey });
        return api(it.action, pl, { silent: true }).then(function (res) {
          if (it.action === 'photo.upload') okP++; else { okN += (res.observations || []).length; rej += (res.rejected || []).length; }
          if ((res.rejected || []).length) { it.rejectedLog = res.rejected; LS.set('lastRejected', res.rejected); }

          it.status = 'CONFLICT'; it.error = e.message; return IDB.put('outbox', it);

    return chain.then(function () {

      if (okN || rej || okP) { toast('Sinkron: ' + okN + ' observasi' + (okP ? ', ' + okP + ' foto dokumentasi' : '') + ' terkirim' + (rej ? ', ' + rej + ' ditolak server (lihat Survei → Antrean)' : '') + '.', rej ? 'bad' : 'ok'); loadData(true); }

  }).catch(function () { syncing = false; });
}

function kmlToGeoJson(txt) {
  var xml = new DOMParser().parseFromString(txt, 'text/xml');
  var feats = [];
  $$('Placemark', xml).forEach(function (pm) {
    var name = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
    var props = { code: name.trim() };
    Array.prototype.forEach.call(pm.getElementsByTagName('SimpleData'), function (sd) { props[sd.getAttribute('name')] = sd.textContent; });
    Array.prototype.forEach.call(pm.getElementsByTagName('Data'), function (sd) { var v = sd.getElementsByTagName('value')[0]; if (v) props[sd.getAttribute('name')] = v.textContent; });
    var polys = Array.prototype.map.call(pm.getElementsByTagName('Polygon'), function (pg) {
      function ring(el) { return el.textContent.trim().split(/\s+/).map(function (c) { var p = c.split(','); return [Number(p[0]), Number(p[1])]; }); }
      var outer = pg.getElementsByTagName('outerBoundaryIs')[0]; var inners = pg.getElementsByTagName('innerBoundaryIs');
      var r = [ring(outer.getElementsByTagName('coordinates')[0])];
      Array.prototype.forEach.call(inners, function (ib) { r.push(ring(ib.getElementsByTagName('coordinates')[0])); });
      return r;
    });
    if (polys.length) feats.push({ type: 'Feature', properties: props, geometry: polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys } });
  });
  return { type: 'FeatureCollection', features: feats };
}

  var h = '<h2 class="pg">Sampel Komposit & Chain of Custody</h2><p class="pg-sub">Alur: Tersampel → Dikemas → Dalam kiriman → Diterima lab / Ditolak → Preparasi → Dianalisis → Selesai.</p><div class="tabs"><button data-sub="list" class="' + (sub === 'list' ? 'on' : '') + '">Daftar sampel</button><button data-sub="dispatch" class="' + (sub === 'dispatch' ? 'on' : '') + '">Surat pengantar (CoC)</button></div>';
  if (sub === 'dispatch') {
    var dl = estOf(d.dispatches).slice().reverse();
    h += '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th>Nomor</th><th>Tanggal</th><th>Sampel</th><th>Kurir</th><th>Tujuan</th><th></th></tr></thead><tbody>' + dl.map(function (x) { return '<tr><td data-l="Nomor" class="mono">' + esc(x.dispatchNumber) + '</td><td data-l="Tanggal">' + fmtD(x.dispatchedAt, true) + '</td><td data-l="Sampel">' + x.totalSamples + ' (' + x.totalConstituentTrees + ' pohon)</td><td data-l="Kurir">' + esc(x.courierName) + ' ' + esc(x.vehiclePlateNumber) + '</td><td data-l="Tujuan">' + esc(x.destinationLab) + '</td><td class="act"><button class="btn s" data-act="printDispatch" data-id="' + x.id + '">🖨 Cetak</button></td></tr>'; }).join('') + '</tbody></table>' + (dl.length ? '' : '<div class="empty">Belum ada pengiriman.</div>') + '</div>';
    $('#main').innerHTML = h; return;
  }
  var f = S.sub.smpF || '';
  var list = estOf(d.samples).filter(function (s) { return !f || s.status === f; }).slice().reverse();
  var field = can('SURVEYOR', 'FIELD_SUPERVISOR', 'ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY');
  h += '<div class="row" style="margin-bottom:10px"><select class="i" style="max-width:200px" id="smpF"><option value="">Semua status</option>' + Object.keys(LABEL).filter(function (k) { return ['SAMPLED', 'PACKED', 'IN_TRANSIT', 'RECEIVED_LAB', 'REJECTED_LAB', 'IN_PREPARATION', 'ANALYZING', 'ANALYSIS_COMPLETED', 'ARCHIVED'].indexOf(k) >= 0; }).map(function (k) { return '<option value="' + k + '"' + (f === k ? ' selected' : '') + '>' + lbl(k) + '</option>'; }).join('') + '</select><span class="sp"></span><button class="btn" data-act="scanSample">📷 Pindai QR</button>' + (field ? '<button class="btn" data-act="genSamples">+ Bentuk komposit</button>' : '') + (can('ESTATE_MANAGER', 'FIELD_SUPERVISOR', 'AGRONOMIST') ? '<button class="btn p" data-act="dispatchForm">🚚 Kirim ke lab</button>' : '') + '<button class="btn" data-act="printLabels">🏷 Label QR</button></div>';
  h += '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th><input type="checkbox" id="smpAll"></th><th>Kode</th><th>Unit</th><th>Pohon</th><th>Berat</th><th>Status</th><th>Lead time</th><th>Aksi</th></tr></thead><tbody>' + list.map(function (s) {
    var u = byId(d.units, s.lsuUnitId) || {};
    var acts = '';
    if (s.status === 'SAMPLED' && can('SURVEYOR', 'FIELD_SUPERVISOR', 'ESTATE_MANAGER')) acts += '<button class="btn s p" data-act="packSample" data-id="' + s.id + '">Kemas</button>';
    if (s.status === 'IN_TRANSIT' && can('LAB_MANAGER', 'LAB_ANALYST')) acts += '<button class="btn s p" data-act="receiveSample" data-id="' + s.id + '">Terima</button><button class="btn s d" data-act="rejectSample" data-id="' + s.id + '">Tolak</button>';
    if (s.status === 'RECEIVED_LAB' && can('LAB_MANAGER', 'LAB_ANALYST')) acts += '<button class="btn s d" data-act="rejectSample" data-id="' + s.id + '">Tolak</button>';
    if ((s.status === 'ANALYSIS_COMPLETED' || s.status === 'REJECTED_LAB') && can('LAB_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY')) acts += '<button class="btn s" data-act="archiveSample" data-id="' + s.id + '">Arsipkan</button>';
    return '<tr><td data-l="Pilih"><input type="checkbox" data-smp value="' + s.id + '"></td><td data-l="Kode" class="mono"><a href="#" data-act="sampleDetail" data-id="' + s.id + '">' + esc(s.code) + '</a></td><td data-l="Unit" class="small">' + esc(u.code) + '</td><td data-l="Pohon">' + s.totalConstituentTrees + ' · P' + s.targetFrondNumber + '</td><td data-l="Berat">' + (s.weightGrams ? fmtN(s.weightGrams) + ' g' : '-') + '</td><td data-l="Status">' + pill(s.status) + (s.rejectionReason ? '<div class="small" style="color:var(--bad)">' + esc(s.rejectionReason) + '</div>' : '') + '</td><td data-l="Lead time">' + (s.leadTimeHours ? '<span class="pill ' + (s.leadTimeHours > (protoActive().maxLeadTimeHoursToLab || 48) ? 'bad' : 'ok') + '">' + fmtN(s.leadTimeHours, 1) + ' j</span>' : '-') + '</td><td class="act"><div class="row" style="gap:4px;justify-content:flex-end">' + acts + '</div></td></tr>';
  }).join('') + '</tbody></table>' + (list.length ? '' : '<div class="empty">Belum ada sampel.</div>') + '</div>';
  $('#main').innerHTML = h;
  $('#smpF').onchange = function () { S.sub.smpF = this.value; VIEWS.samples(); };
  $('#smpAll').onchange = function () { var c = this.checked; $$('[data-smp]').forEach(function (x) { x.checked = c; }); };
};
function selectedSamples() { return $$('[data-smp]:checked').map(function (c) { return byId(D().samples, c.value); }); }
function sampleStatus(id, status, extra, msg) { return saveThen('sample.status', Object.assign({ id: id, status: status }, extra || {}), msg || 'Status sampel diperbarui.'); }
Object.assign(ACT, {
  genSamples: function () {
    // v2.4: hitung hanya observasi pada TAHUN unit (sama seperti server) & dahulukan unit yang punya observasi tertunda
    var used = {}; D().sampleMembers.forEach(function (m) { used[m.treeObservationId] = 1; });
    var pend = {};
    var units = estOf(D().units).map(function (u) { pend[u.id] = D().observations.filter(function (o) { return u.blockIds.indexOf(o.blockId) >= 0 && !used[o.id] && new Date(o.sampledAt).getFullYear() === u.targetYear; }).length; return u; })
      .sort(function (a, b) { return (pend[b.id] > 0) - (pend[a.id] > 0) || b.targetYear - a.targetYear; });
    var pr = protoActive();
    modal('Bentuk Sampel Komposit', '<p class="small muted">Observasi pohon tahun berjalan di unit terpilih dikelompokkan ke kantong komposit ' + (pr.minTreesPerComposite || 20) + '-' + (pr.maxTreesPerComposite || 30) + ' pohon (target ' + (pr.treesPerCompositeSample || 25) + ').</p><label class="f">Unit LSU<select class="i" name="lsuUnitId">' + opts(units, '', function (u) { return u.code + ' · ' + pend[u.id] + ' observasi belum dikelompokkan'; }) + '</select></label>',
      [{ label: 'Batal' }, { label: 'Bentuk', cls: 'p', onClick: function (b, close) { api('sample.generate', formVals(b)).then(function (r) { toast(r.length + ' sampel komposit dibuat: ' + r.map(function (s) { return s.code; }).join(', '), 'ok'); close(); loadData(true); }).catch(fail); return false; } }]);
  },
  packSample: function (el) {
    var s = byId(D().samples, el.getAttribute('data-id')), pr = protoActive();
    modal('Kemas ' + s.code, '<div class="alert info small" style="margin-bottom:10px">Gunakan kantong kertas kraft berpori (bukan plastik). Bersihkan daun dengan kasa + aquadest. Kirim maksimal ' + (pr.maxLeadTimeHoursToLab || 48) + ' jam setelah petik.</div><div class="fg"><label class="f">Berat sampel (gram)<input class="i" type="number" name="weightGrams" min="1"></label><label class="f">Lokasi<input class="i" name="locationName" placeholder="Kantor afdeling"></label><label class="f full">Catatan<input class="i" name="notes"></label></div>',
      [{ label: 'Batal' }, { label: 'Simpan', cls: 'p', onClick: function (b, close) { var v = formVals(b); sampleStatus(s.id, 'PACKED', { weightGrams: Number(v.weightGrams), locationName: v.locationName, notes: v.notes }, 'Sampel dikemas.').then(close); return false; } }]);
  },
  receiveSample: function (el) {
    var s = byId(D().samples, el.getAttribute('data-id'));
    modal('Terima di Lab · ' + s.code, '<div class="fg"><label class="f">Kondisi sampel<select class="i" name="condition"><option value="GOOD">Baik / utuh</option><option value="DAMP">Lembap</option><option value="DAMAGED_PACKAGING">Kemasan rusak</option></select></label><label class="f full">Catatan penerimaan<input class="i" name="notes"></label></div><p class="small muted">Lead time dihitung otomatis dari waktu petik pertama.</p>',
      [{ label: 'Batal' }, { label: 'Terima', cls: 'p', onClick: function (b, close) { var v = formVals(b); sampleStatus(s.id, 'RECEIVED_LAB', v, 'Sampel diterima lab.').then(close); return false; } }]);
  },
  rejectSample: function (el) { var id = el.getAttribute('data-id'); confirmBox('Tolak sampel ini di laboratorium?', function (r) { sampleStatus(id, 'REJECTED_LAB', { rejectionReason: r }, 'Sampel ditolak.'); }, { reason: 'Alasan penolakan (label rusak, berat < 100 g, berjamur, lewat batas waktu…)', danger: true }); },
  archiveSample: function (el) { sampleStatus(el.getAttribute('data-id'), 'ARCHIVED'); },
  dispatchForm: function () {
    var sel = selectedSamples().filter(function (s) { return s && s.status === 'PACKED'; });
    if (!sel.length) { var packed = estOf(D().samples).filter(function (s) { return s.status === 'PACKED'; }); if (!packed.length) return toast('Tidak ada sampel berstatus Dikemas.', 'bad'); sel = packed; }
    modal('Surat Pengantar Sampel ke Lab', '<p class="small">' + sel.length + ' sampel: <span class="mono">' + sel.map(function (s) { return esc(s.code); }).join(', ') + '</span></p><div class="fg"><label class="f">Nama kurir<input class="i" name="courierName"></label><label class="f">No. polisi kendaraan<input class="i" name="vehiclePlateNumber"></label><label class="f full">Laboratorium tujuan<input class="i" name="destinationLab" placeholder="Laboratorium Sentral Agronomi"></label><label class="f full">Catatan<input class="i" name="notes"></label></div>',
      [{ label: 'Batal' }, { label: 'Kirim & cetak', cls: 'p', onClick: function (b, close) { var v = formVals(b); v.sampleIds = sel.map(function (s) { return s.id; }); saveThen('sample.dispatch', v, 'Sampel dikirim.', close).then(function (dsp) { ACT.printDispatch(null, dsp); }); return false; } }]);
  },
  printDispatch: function (el, dsp) {
    dsp = dsp || byId(D().dispatches, el.getAttribute('data-id'));
    var est = byId(D().estates, dsp.estateId) || {};
    printHtml(docHeader('Surat Pengantar & Berita Acara Serah Terima Sampel Daun', est.name) + '<table><tr><td>Nomor</td><td><b>' + esc(dsp.dispatchNumber) + '</b></td><td>Tanggal kirim</td><td>' + fmtD(dsp.dispatchedAt, true) + '</td></tr><tr><td>Kurir</td><td>' + esc(dsp.courierName) + '</td><td>Kendaraan</td><td>' + esc(dsp.vehiclePlateNumber || '-') + '</td></tr><tr><td>Tujuan</td><td colspan="3">' + esc(dsp.destinationLab) + '</td></tr></table><h2>Daftar sampel</h2><table><tr><th>No</th><th>Kode sampel</th><th>QR</th><th>Pohon</th><th>Berat (g)</th><th>Kondisi diterima</th></tr>' + dsp.sampleIds.map(function (id, i) { var s = byId(D().samples, id) || { code: dsp.sampleCodes[i] }; return '<tr><td>' + (i + 1) + '</td><td>' + esc(s.code) + '</td><td style="width:70px">' + qrSvg(s.code) + '</td><td>' + (s.totalConstituentTrees || '') + '</td><td>' + (s.weightGrams || '') + '</td><td></td></tr>'; }).join('') + '</table><p>Catatan: ' + esc(dsp.notes || 'Sampel daun wajib tiba < 48 jam sesuai SOP.') + '</p><div class="sig"><div>Pengirim<br>' + esc(dsp.dispatcherName) + '</div><div>Kurir<br>' + esc(dsp.courierName) + '</div><div>Penerima Lab</div></div>');
  },
  printLabels: function () {
    var sel = selectedSamples(); if (!sel.length) sel = estOf(D().samples).filter(function (s) { return ['SAMPLED', 'PACKED'].indexOf(s.status) >= 0; });
    if (!sel.length) return toast('Pilih sampel terlebih dahulu.', 'bad');
    printHtml('<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">' + sel.map(function (s) { var u = byId(D().units, s.lsuUnitId) || {}; var e = byId(D().estates, s.estateId) || {}; return '<div class="qr-label">' + qrSvg(s.code) + '<div><b style="font-size:13px">' + esc(s.code) + '</b><br>' + esc(e.name) + '<br>Unit ' + esc(u.code) + ' · ' + s.totalConstituentTrees + ' pohon · Pelepah ' + s.targetFrondNumber + '<br>Petik: ' + fmtD(s.createdAt) + '<br><small>Kantong kraft berpori · jangan plastik</small></div></div>'; }).join('') + '</div>');
  },
  scanSample: function () { scanQr(function (code) { var s = D().samples.filter(function (x) { return x.code.toLowerCase() === code.toLowerCase() || x.id === code; })[0]; if (!s) { try { var j = JSON.parse(code); s = D().samples.filter(function (x) { return x.code === j.c || x.code === j.code; })[0]; } catch (e) { } } if (s) ACT.sampleDetail(null, s); else toast('Sampel "' + code + '" tidak ditemukan pada data Anda.', 'bad'); }); },
  sampleDetail: function (el, s) {
    s = s || byId(D().samples, el.getAttribute('data-id'));
    var d = D(), u = byId(d.units, s.lsuUnitId) || {};
    var ev = d.custody.filter(function (c) { return c.sampleId === s.id; }).sort(function (a, b) { return a.timestamp < b.timestamp ? -1 : 1; });
    var mem = d.sampleMembers.filter(function (m) { return m.sampleId === s.id; }).map(function (m) { return byId(d.observations, m.treeObservationId); }).filter(Boolean);
    var lr = d.labResults.filter(function (r) { return r.sampleId === s.id; })[0];
    modal('Sampel ' + s.code, '<div class="row" style="gap:14px;align-items:flex-start"><div style="width:110px">' + qrSvg(s.code) + '</div><div class="sp"><div>' + pill(s.status) + '</div><div class="small" style="margin-top:6px">Unit ' + esc(u.code) + ' · ' + s.totalConstituentTrees + ' pohon · pelepah ' + s.targetFrondNumber + ' · ' + (s.weightGrams ? s.weightGrams + ' g' : 'belum ditimbang') + '</div>' + (s.dispatchNumber ? '<div class="small">Surat pengantar: <span class="mono">' + esc(s.dispatchNumber) + '</span></div>' : '') + (lr ? '<div class="small">Hasil lab: ' + pill(lr.status) + '</div>' : '') + '</div></div><h4>Rantai kustodi</h4><div class="timeline">' + ev.map(function (c) { return '<div class="ev"><b>' + esc(c.stage.replace(/_/g, ' ')) + '</b> · ' + fmtD(c.timestamp, true) + ' <span class="pill ' + (c.sampleIntegrityCondition === 'GOOD' ? 'ok' : 'warn') + '">' + esc(c.sampleIntegrityCondition) + '</span><div class="small">' + esc(c.senderActorName) + ' → ' + esc(c.receiverActorName) + (c.locationName ? ' · ' + esc(c.locationName) : '') + '</div><div class="small muted">' + esc(c.notes) + ' · <span class="mono">' + esc(c.signatureToken) + '</span></div></div>'; }).join('') + '</div><h4>Foto dokumentasi</h4>' + photoStrip('SAMPLE', s.id, s.status === 'SAMPLED' || s.status === 'PACKED' ? 'Pengemasan & Label' : (s.receivedAtLabAt ? 'Preparasi Lab' : 'Serah Terima & Pengiriman')) + '<h4>Pohon penyusun (' + mem.length + ')</h4><div class="chips">' + mem.map(function (o) { var t = byId(d.trees, o.treeId) || {}; return '<span class="pill ' + ((o.deviationFlags || []).length ? 'warn' : '') + '" title="' + esc((o.deviationFlags || []).join(', ')) + '">' + esc(t.tagCode || o.treeId) + '</span>'; }).join('') + '</div>', [{ label: 'Cetak label', onClick: function () { printHtml('<div class="qr-label" style="width:9cm">' + qrSvg(s.code) + '<div><b>' + esc(s.code) + '</b><br>Unit ' + esc(u.code) + '<br>' + s.totalConstituentTrees + ' pohon · P' + s.targetFrondNumber + '</div></div>'); } }, { label: 'Tutup' }], { wide: true });
  }
});

/* =================== Laboratorium =================== */
var NUT_FIELDS = [['nitrogenPercent', 'N (%)'], ['phosphorusPercent', 'P (%)'], ['potassiumPercent', 'K (%)'], ['magnesiumPercent', 'Mg (%)'], ['calciumPercent', 'Ca (%)'], ['boronPpm', 'B (ppm)'], ['copperPpm', 'Cu (ppm)'], ['zincPpm', 'Zn (ppm)']];
VIEWS.lab = function () {
  var d = D(), sub = S.sub.lab || 'results';
  var tabs = [['orders', 'Penerimaan & Order'], ['results', 'Hasil Uji'], ['qc', 'QA/QC']];
  var h = '<h2 class="pg">Laboratorium & Analisis Hara</h2><p class="pg-sub">Input → Verifikasi QC (CRM + Blanko wajib) → Persetujuan Lab Manager (prinsip 4 mata) → Revisi tercatat permanen.</p>' + agroBadgeHtml() + '<div class="tabs">' + tabs.map(function (t) { return '<button data-sub="' + t[0] + '" class="' + (sub === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';
  var lab = can('LAB_MANAGER', 'LAB_ANALYST');
  if (sub === 'orders') {
    var recv = estOf(d.samples).filter(function (s) { return s.status === 'RECEIVED_LAB'; });
    h += '<div class="card" style="margin-bottom:14px"><h3>Sampel diterima, belum masuk order (' + recv.length + ')</h3>' + (recv.length ? '<div class="chips" style="margin-bottom:10px">' + recv.map(function (s) { return '<label class="pill"><input type="checkbox" data-ord value="' + s.id + '" checked> ' + esc(s.code) + '</label>'; }).join('') + '</div>' + (can('LAB_MANAGER') ? '<button class="btn p" data-act="labOrder">Buat order uji</button>' : '<span class="small muted">Order dibuat oleh Lab Manager.</span>') : '<p class="muted small">Tidak ada.</p>') + '</div>';
    var ords = estOf(d.labOrders).slice().reverse();
    h += '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th>Nomor</th><th>Diterima</th><th>Target selesai</th><th>Sampel</th><th>Lab</th><th>Status</th></tr></thead><tbody>' + ords.map(function (o) { return '<tr><td data-l="Nomor" class="mono">' + esc(o.orderNumber) + '</td><td data-l="Diterima">' + fmtD(o.receivedDate) + '</td><td data-l="Target">' + fmtD(o.targetCompletionDate) + '</td><td data-l="Sampel">' + o.totalSamples + '</td><td data-l="Lab" class="small">' + esc(o.laboratoryName) + '</td><td data-l="Status">' + pill(o.status) + '</td></tr>'; }).join('') + '</tbody></table>' + (ords.length ? '' : '<div class="empty">Belum ada order.</div>') + '</div>';
  } else if (sub === 'results') {
    var pending = estOf(d.samples).filter(function (s) { return (s.status === 'IN_PREPARATION' || s.status === 'ANALYZING') && !d.labResults.some(function (r) { return r.sampleId === s.id; }); });
    if (lab && pending.length) h += '<div class="alert info" style="margin-bottom:12px">' + pending.length + ' sampel menunggu input hasil: ' + pending.map(function (s) { return '<button class="btn s" data-act="resultForm" data-sample="' + s.id + '">' + esc(s.code) + '</button>'; }).join(' ') + '</div>';
    var rs = estOf(d.labResults).slice().reverse();
    h += '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th>Sampel</th><th>Batch</th>' + NUT_FIELDS.map(function (f) { return '<th>' + f[1] + '</th>'; }).join('') + '<th>Status</th><th></th></tr></thead><tbody>' + rs.map(function (r) {
      var s = byId(d.samples, r.sampleId) || {};
      var acts = '<button class="btn s" data-act="diagnose" data-id="' + r.sampleId + '">Diagnosis</button>';
      if (r.status === 'ENTERED' && lab) acts += '<button class="btn s" data-act="resultForm" data-sample="' + r.sampleId + '">Edit</button><button class="btn s p" data-act="verifyQc" data-id="' + r.id + '">Verifikasi QC</button>';
      if ((r.status === 'QC_VERIFIED' || r.status === 'REVISED') && can('LAB_MANAGER')) acts += '<button class="btn s p" data-act="approveResult" data-id="' + r.id + '">Setujui</button>';
      if ((r.status === 'APPROVED' || r.status === 'REVISED') && can('LAB_MANAGER')) acts += '<button class="btn s w" data-act="reviseResult" data-id="' + r.id + '">Revisi</button>';
      if (r.status === 'APPROVED') acts += '<button class="btn s" data-act="printCert" data-id="' + r.id + '">🖨 Sertifikat</button>';
      return '<tr><td data-l="Sampel" class="mono">' + esc(s.code) + '</td><td data-l="Batch" class="mono small">' + esc(r.batchNumber) + '</td>' + NUT_FIELDS.map(function (f) { var n = (d.nutrients || []).filter(function (x) { return x.f === f[0]; })[0]; var v = r.values[f[0]]; var c = n ? (v < n.acute ? 'bad' : v < n.low ? 'warn' : v <= n.optHi ? 'ok' : 'info') : ''; return '<td data-l="' + f[1] + '"><span class="pill ' + c + '">' + fmtN(v, 3) + '</span></td>'; }).join('') + '<td data-l="Status">' + pill(r.status) + (r.revisionCount ? '<div class="small">rev ' + r.revisionCount + '</div>' : '') + '</td><td class="act"><div class="row" style="gap:4px;justify-content:flex-end">' + acts + '</div></td></tr>';
    }).join('') + '</tbody></table>' + (rs.length ? '' : '<div class="empty">Belum ada hasil uji.</div>') + '</div>';
  } else {
    var qc = (d.qcRecords || []).slice().reverse();
    h += '<div class="row" style="margin-bottom:10px"><span class="sp small muted">CRM: deviasi relatif ≤ toleransi (default 5%). Duplikat: RPD ≤ 5%. Blanko: nilai ≤ batas deteksi (default 0,005).</span>' + (lab ? '<button class="btn p" data-act="qcForm">+ Data QC</button>' : '') + '</div>';
    h += '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th>Batch</th><th>Jenis</th><th>Parameter</th><th>Acuan</th><th>Terukur</th><th>Deviasi</th><th>Hasil</th><th>Oleh</th></tr></thead><tbody>' + qc.map(function (q) { return '<tr><td data-l="Batch" class="mono">' + esc(q.batchNumber) + '</td><td data-l="Jenis">' + esc(q.qcSampleType.replace(/_/g, ' ')) + '</td><td data-l="Parameter">' + esc(q.parameterName) + '</td><td data-l="Acuan">' + fmtN(q.expectedValue, 4) + '</td><td data-l="Terukur">' + fmtN(q.measuredValue, 4) + '</td><td data-l="Deviasi">' + fmtN(q.relativeDeviationPercent, 2) + (q.qcSampleType === 'BLANK' ? '' : '%') + '</td><td data-l="Hasil">' + (q.isWithinTolerance ? pill('OPTIMAL').replace('Optimum', 'Lulus') : pill('REJECTED').replace('Ditolak', 'Gagal')) + '</td><td data-l="Oleh" class="small">' + esc(q.recordedBy) + '</td></tr>'; }).join('') + '</tbody></table>' + (qc.length ? '' : '<div class="empty">Belum ada data QC.</div>') + '</div>';
  }
  $('#main').innerHTML = h;

  var root = document.getElementById('agroPerf'); if (!root) return;
  var ys = document.getElementById('agroYear'); if (ys) ys.onchange = function () { S.agroYear = Number(ys.value); render(); };
  loadD3().then(function (d3) {
    if (!document.getElementById('agroPerf')) return;
    drawProgress(d3); drawSchedule(d3); drawTrends(d3);
  }).catch(function () {
    $$('#agroPerf .agro-ph').forEach(function (p) { p.innerHTML = '📴 Grafik memerlukan koneksi saat pertama kali dibuka. Ringkasan teks tetap tersedia.'; });
  });
}

function drawProgress(d3) {
  var el = document.getElementById('agProg'); if (!el) return;
  var Y = agroDefaultYear();
  var pr = agroProgress(Y), loc = agFmt(d3);
  var W = Math.max(280, el.clientWidth), H = 240, m = { t: 14, r: 56, b: 26, l: 40 };
  el.innerHTML = '';
  var svg = d3.select(el).append('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('width', '100%').attr('height', H);
  var x = d3.scaleTime().domain([pr.y0, pr.y1]).range([m.l, W - m.r]);
  var ymax = Math.max(pr.target, pr.plannedTotal, pr.count, 5) * 1.1;
  var y = d3.scaleLinear().domain([0, ymax]).nice().range([H - m.b, m.t]);
  svg.append('g').attr('class', 'ag-grid').attr('transform', 'translate(' + m.l + ',0)').call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(d3.format('~s'))).call(function (g) { g.select('.domain').remove(); });
  svg.append('g').attr('class', 'ag-ax').attr('transform', 'translate(0,' + (H - m.b) + ')').call(d3.axisBottom(x).ticks(d3.timeMonth.every(W < 460 ? 2 : 1)).tickFormat(loc.format('%b')));
  // target
  svg.append('line').attr('class', 'ag-target').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(pr.target)).attr('y2', y(pr.target));
  svg.append('text').attr('class', 'ag-lbl').attr('x', W - m.r + 4).attr('y', y(pr.target) + 4).text('Target ' + fmtN(pr.target));
  // rencana
  if (pr.planned.length) {
    svg.append('path').datum(pr.planned).attr('class', 'ag-plan').attr('d', d3.line().x(function (p) { return x(p.t); }).y(function (p) { return y(p.c); }));
    if (pr.plannedTotal !== pr.target) svg.append('text').attr('class', 'ag-lbl plan').attr('x', W - m.r + 4).attr('y', y(pr.plannedTotal) + 4).text('Rencana ' + fmtN(pr.plannedTotal));
  }
  // aktual (langkah)
  var act = [{ t: pr.y0, c: 0 }].concat(pr.actual);
  if (pr.count) act.push({ t: pr.isCur ? pr.ref : pr.actual[pr.actual.length - 1].t, c: pr.count });
  svg.append('path').datum(act).attr('class', 'ag-area').attr('d', d3.area().curve(d3.curveStepAfter).x(function (p) { return x(p.t); }).y0(y(0)).y1(function (p) { return y(p.c); }));
  svg.append('path').datum(act).attr('class', 'ag-act').attr('d', d3.line().curve(d3.curveStepAfter).x(function (p) { return x(p.t); }).y(function (p) { return y(p.c); }));
  if (pr.count) {
    var lp = act[act.length - 1];
    svg.append('circle').attr('class', 'ag-actdot').attr('cx', x(lp.t)).attr('cy', y(lp.c)).attr('r', 4);
    var right = x(lp.t) > m.l + (W - m.l - m.r) * 0.7;
    svg.append('text').attr('class', 'ag-lbl act').attr('text-anchor', right ? 'end' : 'start').attr('x', x(lp.t) + (right ? -8 : 6)).attr('y', y(lp.c) - 7).text(fmtN(pr.count) + ' (' + (pr.target ? Math.round(pr.count / pr.target * 100) : 0) + '%)');
  }
  if (pr.isCur) {
    svg.append('line').attr('class', 'ag-today').attr('x1', x(pr.ref)).attr('x2', x(pr.ref)).attr('y1', m.t).attr('y2', H - m.b);
    svg.append('text').attr('class', 'ag-lbl today').attr('x', x(pr.ref)).attr('y', m.t - 3).attr('text-anchor', 'middle').text('Hari ini');
  }
  if (!pr.count && !pr.planned.length) svg.append('text').attr('class', 'ag-empty').attr('x', (W + m.l - m.r) / 2).attr('y', H / 2).attr('text-anchor', 'middle').text('Belum ada observasi atau rencana untuk ' + Y);
  // interaksi
  var rule = svg.append('line').attr('class', 'ag-rule').attr('y1', m.t).attr('y2', H - m.b).style('opacity', 0);
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
    .on('pointermove', function (ev) {
      var t = x.invert(d3.pointer(ev)[0]); rule.attr('x1', x(t)).attr('x2', x(t)).style('opacity', 1);
      var c = 0; pr.actual.forEach(function (p) { if (p.t <= t) c = p.c; });
      var pl = 0; pr.planned.forEach(function (p, i) { var q = pr.planned[i + 1]; if (p.t <= t) pl = q && q.t > t ? p.c + (q.c - p.c) * (t - p.t) / (q.t - p.t) : p.c; });
      tipShow(ev, '<b>' + fmtDs(t) + '</b><br>Aktual kumulatif: <b>' + fmtN(c) + '</b> pohon' + (pr.planned.length ? '<br>Rencana: ' + fmtN(Math.round(pl)) : '') + '<br>Target: ' + fmtN(pr.target));
    }).on('pointerleave', function () { rule.style('opacity', 0); tipHide(); });
}

function drawSchedule(d3) {
  var el = document.getElementById('agSched'); if (!el) return;
  var sc = agroSchedule(), loc = agFmt(d3);
  var rows = sc.rows.slice(0, 10), more = sc.rows.length - rows.length;
  var W = Math.max(280, el.clientWidth), rh = 24, m = { t: 22, r: 10, b: 18, l: W < 420 ? 74 : 104 };
  var H = m.t + Math.max(1, rows.length) * rh + m.b + (more > 0 ? 16 : 0);
  el.innerHTML = '';
  var svg = d3.select(el).append('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('width', '100%').attr('height', H);
  var x = d3.scaleTime().domain([sc.hs, sc.he]).range([m.l, W - m.r]);
  svg.append('g').attr('class', 'ag-grid').attr('transform', 'translate(0,' + m.t + ')').call(d3.axisTop(x).ticks(d3.timeMonth.every(1)).tickSize(-(H - m.t - m.b)).tickFormat(loc.format('%b'))).call(function (g) { g.select('.domain').remove(); g.selectAll('text').attr('dy', '-2'); });
  if (!rows.length) { svg.append('text').attr('class', 'ag-empty').attr('x', (W + m.l) / 2).attr('y', m.t + 16).attr('text-anchor', 'middle').text('Tidak ada jadwal'); }
  var cl = function (t) { return Math.max(m.l, Math.min(W - m.r, x(t))); };
  var g = svg.selectAll('g.ag-row').data(rows).enter().append('g').attr('class', 'ag-row').attr('transform', function (r, i) { return 'translate(0,' + (m.t + i * rh) + ')'; });
  g.append('rect').attr('class', 'ag-band').attr('x', 0).attr('width', W).attr('height', rh).attr('fill', function (r, i) { return i % 2 ? '#f8fafc' : 'transparent'; });
  g.append('text').attr('class', 'ag-rl').attr('x', 4).attr('y', rh / 2 + 4).text(function (r) { var t = (r.kind === 'proj' ? '◌ ' : '') + r.label + ' ' + r.est; return t.length > (W < 420 ? 11 : 16) ? t.slice(0, W < 420 ? 10 : 15) + '…' : t; });
  g.append('rect').attr('class', function (r) { return 'ag-bar ' + r.kind + (r.late ? ' late' : ''); })
    .attr('x', function (r) { return cl(r.start); }).attr('y', 5).attr('height', rh - 10).attr('rx', 4)
    .attr('width', function (r) { return Math.max(4, cl(r.end) - cl(r.start)); })
    .attr('fill', function (r) { return r.kind === 'plan' ? (r.late ? '#b91c1c' : PLAN_COL[r.status] || '#2563eb') : (r.late ? '#fee2e2' : r.soon ? '#fef3c7' : '#f1f5f9'); })
    .attr('stroke', function (r) { return r.kind === 'proj' ? (r.late ? '#b91c1c' : '#64748b') : 'none'; });
  g.filter(function (r) { return r.kind === 'proj'; }).append('circle').attr('cx', function (r) { return cl(r.dueDate); }).attr('cy', rh / 2).attr('r', 3).attr('fill', function (r) { return r.late ? '#b91c1c' : '#334155'; });
  g.each(function (r) { var gg = d3.select(this); (r.due || []).forEach(function (dd) { if (dd >= sc.hs && dd <= sc.he) gg.append('path').attr('class', 'ag-dia').attr('d', d3.symbol(d3.symbolDiamond, 46)()).attr('transform', 'translate(' + x(dd) + ',' + rh / 2 + ')'); }); });
  g.on('pointermove', function (ev, r) {
    tipShow(ev, '<b>' + esc(r.title) + '</b><br>' + esc(r.est) + ' · Blok ' + esc(r.blocks.join(', ')) + '<br>' + (r.kind === 'plan' ? 'Jendela: ' + fmtDs(r.start) + ' – ' + fmtDs(r.end) + '<br>Status: ' + esc(lbl(r.status)) + (r.due.length ? '<br>Batas tugas: ' + r.due.map(fmtDs).join(', ') : '') : 'Sampling terakhir: ' + fmtDs(r.last) + '<br>Perkiraan berikutnya: <b>' + fmtDs(r.dueDate) + '</b> (±14 hari)') + (r.late ? '<br><b style="color:#fca5a5">Terlambat</b>' : ''));
  }).on('pointerleave', tipHide).on('click', function (ev, r) { tipHide(); if (r.kind === 'plan') go('plan'); else jumpTo('blk', r.id); }).style('cursor', 'pointer');
  svg.append('line').attr('class', 'ag-today').attr('x1', x(sc.today)).attr('x2', x(sc.today)).attr('y1', m.t).attr('y2', m.t + Math.max(1, rows.length) * rh);
  var bot = m.t + Math.max(1, rows.length) * rh;
  svg.append('text').attr('class', 'ag-lbl today').attr('x', x(sc.today)).attr('y', bot + 12).attr('text-anchor', 'middle').text('Hari ini');
  if (more > 0) svg.append('text').attr('class', 'ag-lbl').attr('x', 4).attr('y', bot + 12).text('+' + more + ' lainnya');
}

function sparkline(d3, el, n, pts, opt) {
  opt = opt || {};
  var W = Math.max(120, el.clientWidth || 160), H = opt.h || 70, m = { t: 6, r: 10, b: 14, l: 10 };
  el.innerHTML = '';
  var svg = d3.select(el).append('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('width', '100%').attr('height', H).attr('role', 'img').attr('aria-label', n.k + ' tren: ' + pts.map(function (p) { return p.y + ' ' + fmtN(p.v, nutDec(n)); }).join(', '));
  var vs = pts.map(function (p) { return p.v; });
  var span = n.optHi - n.low, lo = Math.min(d3.min(vs), n.low) - span * 0.45, hi = Math.max(d3.max(vs), n.optHi) + span * 0.45;
  var y = d3.scaleLinear().domain([lo, hi]).range([H - m.b, m.t]);
  var x = d3.scalePoint().domain(pts.map(function (p) { return p.y; })).range([m.l, W - m.r]).padding(pts.length === 1 ? 0.5 : 0.15);
  [[lo, n.acute, 'ACUTE_DEFICIENT'], [n.acute, n.low, 'DEFICIENT'], [n.low, n.optHi, 'OPTIMAL'], [n.optHi, n.hiHi, 'HIGH'], [n.hiHi, hi, 'EXCESS']].forEach(function (z) {
    var a = Math.max(z[0], lo), b = Math.min(z[1], hi); if (b <= a) return;
    svg.append('rect').attr('x', 0).attr('width', W).attr('y', y(b)).attr('height', y(a) - y(b)).attr('fill', NUT_ZONE[z[2]]);
  });
  svg.append('line').attr('class', 'ag-opt').attr('x1', 0).attr('x2', W).attr('y1', y(n.low)).attr('y2', y(n.low));
  if (pts.length > 1) svg.append('path').datum(pts).attr('class', 'ag-tl').attr('d', d3.line().x(function (p) { return x(p.y); }).y(function (p) { return y(p.v); }));
  svg.selectAll('circle').data(pts).enter().append('circle').attr('cx', function (p) { return x(p.y); }).attr('cy', function (p) { return y(p.v); }).attr('r', 4).attr('fill', function (p) { return NUT_COL[p.cls]; }).attr('stroke', '#fff').attr('stroke-width', 1.5)
    .on('pointermove', function (ev, p) { tipShow(ev, '<b>' + n.k + ' ' + p.y + '</b>: ' + fmtN(p.v, nutDec(n)) + ' ' + n.unit + '<br>' + lbl(p.cls) + (p.n ? ' · ' + p.n + ' sampel' : '') + '<br>Optimum ' + fmtN(n.low, nutDec(n)) + '–' + fmtN(n.optHi, nutDec(n))); }).on('pointerleave', tipHide);
  svg.selectAll('text.yl').data(pts).enter().append('text').attr('class', 'ag-yl').attr('x', function (p) { return x(p.y); }).attr('y', H - 2).attr('text-anchor', 'middle').text(function (p) { return p.y; });
}
function drawTrends(d3) {
  var tr = agroTrends();
  $$('#agTrend [data-trend]').forEach(function (el) { var t = tr[Number(el.getAttribute('data-trend'))]; if (t) sparkline(d3, el, t.n, t.pts); });
}

/* ---------- Badge & panel peringatan di Laboratorium ---------- */
function agroBadgeHtml() {
  var al = agroAlerts(); S.agroAl = al;
  var crit = al.filter(function (a) { return a.sev === 'crit'; }).length, warn = al.filter(function (a) { return a.sev === 'warn'; }).length, watch = al.length - crit - warn;
  if (!approvedResults().length) return '';
  if (!al.length) return '<div class="agro-badge ok" id="agroBadge">✅ Semua tren hara (hasil disetujui) berada dalam rentang optimum</div>';
  var cls = crit ? 'crit' : warn ? 'warn' : 'watch';
  var txt = (crit + warn) ? '<b>' + (crit + warn) + '</b> tren hara di luar ambang optimum' + (crit ? ' · ' + crit + ' kritis' : '') + (watch ? ' · ' + watch + ' waspada' : '') : '<b>' + watch + '</b> tren hara perlu diwaspadai';
  var open = S.agroOpen !== false;
  return '<button class="agro-badge ' + cls + '" id="agroBadge" data-act="agroToggle" aria-expanded="' + open + '" aria-controls="agroAlerts"><span class="pulse"></span><span class="ag-bt">⚠ ' + txt + '</span><span class="chev">' + (open ? '▴' : '▾') + '</span></button>' + (open ? agroAlertsHtml(al) : '');
}
function agroAlertsHtml(al) {
  var f = S.agroSev || 'all';
  var list = al.filter(function (a) { return f === 'all' || a.sev === f; });
  return '<div class="agro-alerts" id="agroAlerts"><div class="aa-head"><div class="chips">' + [['all', 'Semua', al.length]].concat(Object.keys(SEV).map(function (k) { return [k, SEV[k].t, al.filter(function (a) { return a.sev === k; }).length]; })).map(function (c) { return '<button class="btn s' + (f === c[0] ? ' p' : '') + '" data-act="agroSev" data-sev="' + c[0] + '">' + c[1] + ' (' + c[2] + ')</button>'; }).join('') + '</div><span class="small muted">Rata-rata hasil disetujui per kelompok blok, tahun terbaru vs tahun sebelumnya · RULE-AGRO-2026.01</span></div>' +
    '<div class="aa-grid">' + list.map(function (a, i) {
      var n = a.n, dec = nutDec(n);
      var trend = a.delta === null ? '<span class="muted small">baru 1 tahun data</span>' : '<span class="ag-d ' + (a.worse ? 'bad' : 'ok') + '">' + (a.delta >= 0 ? '▲' : '▼') + ' ' + fmtN(Math.abs(a.delta), 1) + '%</span> <span class="small muted">vs ' + a.py + ' (' + fmtN(a.pv, dec) + ')' + (a.worse ? ' · memburuk' : ' · membaik') + '</span>';
      return '<div class="aa-card sev-' + a.sev + '" data-alert="' + al.indexOf(a) + '"><div class="aa-top"><span class="aa-nut" style="background:' + NUT_COL[a.cls] + '">' + n.k + '</span><div class="sp"><b>' + esc(NUT_NAME[n.k] || n.k) + '</b> <span class="small muted">' + a.y + '</span><div class="small muted">' + esc(a.estCode) + ' · Blok ' + esc(a.blocks.join(', ')) + ' · ' + esc(a.unitCode) + '</div></div><span class="pill ' + SEV[a.sev].c + '">' + SEV[a.sev].t + '</span></div>' +
        '<div class="aa-val"><span class="v">' + fmtN(a.v, dec) + '</span> ' + n.unit + ' ' + trend + '</div><div class="ag-spark" data-aspark="' + al.indexOf(a) + '"></div>' +
        '<div class="small"><b>' + esc(a.why) + '</b> · ' + lbl(a.cls) + ' · optimum ' + fmtN(n.low, dec) + '–' + fmtN(n.optHi, dec) + ' ' + n.unit + '</div>' +
        '<div class="row" style="gap:6px;margin-top:8px">' + (a.sampleId ? '<button class="btn s" data-act="diagnose" data-id="' + a.sampleId + '">Diagnosis</button>' : '') + '<button class="btn s" data-act="agroJump" data-blk="' + a.blockIds[0] + '">📍 Peta</button>' + (can('AGRONOMIST', 'HEAD_AGRONOMY') ? '<button class="btn s" data-nav="reco">Rekomendasi</button>' : '') + '</div></div>';
    }).join('') + (list.length ? '' : '<div class="empty">Tidak ada peringatan pada kategori ini.</div>') + '</div></div>';
}
function agroLabDraw() {
  if (!document.getElementById('agroAlerts')) return;
  loadD3().then(function (d3) {
    var al = S.agroAl || [];
    $$('#agroAlerts [data-aspark]').forEach(function (el) { var a = al[Number(el.getAttribute('data-aspark'))]; if (a) sparkline(d3, el, a.n, a.series, { h: 58 }); });
  }).catch(function () { $$('#agroAlerts [data-aspark]').forEach(function (el) { var a = (S.agroAl || [])[Number(el.getAttribute('data-aspark'))]; if (a) el.innerHTML = '<div class="small muted">' + a.series.map(function (p) { return p.y + ': ' + fmtN(p.v, nutDec(a.n)); }).join(' → ') + '</div>'; }); });
}

  /* ---- Privasi di Profil ---- */
  waConsent: function (el) { api('consent.wa', { consent: el.checked }).then(function (u) { S.user = Object.assign(S.user, u); LS.set('user', S.user); toast(el.checked ? 'Persetujuan WhatsApp diberikan.' : 'Persetujuan WhatsApp ditarik — notifikasi WA dihentikan.', 'ok'); }).catch(function (e) { el.checked = !el.checked; fail(e); }); },
  exportMyData: function () { api('privacy.export', {}).then(function (d) { downloadText('data-pribadi-' + S.user.username + '-' + today() + '.json', JSON.stringify(d, null, 1), 'application/json'); toast('Salinan data pribadi diunduh.', 'ok'); }).catch(fail); },
  dataRequest: function () {
    var c = legalCtx(), types = c.types && Object.keys(c.types).length ? c.types : { AKSES: 'Akses & salinan data', PERBAIKAN: 'Perbaikan data', PENGHAPUSAN: 'Penghapusan data', PENARIKAN: 'Penarikan persetujuan', KEBERATAN: 'Keberatan / pembatasan', LAINNYA: 'Lainnya' };
    modal('Ajukan Permohonan Data Pribadi', '<div class="grid"><label class="f">Jenis permohonan<select class="i" name="type">' + Object.keys(types).map(function (k) { return '<option value="' + k + '">' + esc(types[k]) + '</option>'; }).join('') + '</select></label><label class="f">Penjelasan<textarea class="i" name="detail" placeholder="Jelaskan data yang dimaksud dan permohonan Anda"></textarea></label><p class="small muted">Permohonan diteruskan ke administrator/PPDP ' + esc(c.ctrl) + ' dan tercatat. Penarikan persetujuan WhatsApp langsung berlaku.</p></div>',
      [{ label: 'Batal' }, { label: 'Kirim', cls: 'p', onClick: function (b, close) { api('privacy.request', formVals(b)).then(function () { close(); toast('Permohonan terkirim.', 'ok'); if (S.tab === 'profile') VIEWS.profile(); }).catch(fail); return false; } }]);
  },
  /* ---- Admin: tindak lanjut ---- */
  dsrResolve: function (el) {
    var id = el.getAttribute('data-id');
    modal('Tindak Lanjut Permohonan', '<div class="grid"><label class="f">Status<select class="i" name="status"><option value="DIPROSES">Diproses</option><option value="SELESAI">Selesai</option><option value="DITOLAK">Ditolak (sertakan alasan hukum)</option></select></label><label class="f">Tanggapan kepada pemohon<textarea class="i" name="response"></textarea></label><p class="small muted">Catatan: penarikan persetujuan wajib dihentikan pemrosesannya paling lambat 3×24 jam setelah terverifikasi (PP 33/2026). Data yang wajib disimpan untuk audit/rantai bukti dapat dikecualikan dari penghapusan.</p></div>',
      [{ label: 'Batal' }, { label: 'Simpan', cls: 'p', onClick: function (b, close) { var v = formVals(b); v.id = id; api('privacy.resolve', v).then(function () { close(); toast('Permohonan diperbarui.', 'ok'); VIEWS.admin(); }).catch(fail); return false; } }]);
  },
  savePrivacySettings: function () { var v = formVals($('#privSet')); api('settings.branding', v).then(function (b) { S.branding = b; LS.set('branding', b); fetchLegal(); toast('Pengaturan privasi disimpan.', 'ok'); }).catch(fail); }
});

/** Bagian Privasi di halaman Profil */
function profilePrivacyHtml() {
  var u = S.user || {}, c = legalCtx();
  return '<div class="card" style="margin-top:14px"><h3>🔒 Privasi & persetujuan</h3><table class="t"><tr><td>Syarat & Ketentuan</td><td>' + (u.termsAcceptedAt ? '✅ v' + esc(u.termsVersion) + ' · ' + fmtD(u.termsAcceptedAt, true) : '—') + '</td></tr><tr><td>Pemberitahuan Privasi</td><td>' + (u.privacyAckAt ? '✅ v' + esc(u.privacyVersion) + ' · ' + fmtD(u.privacyAckAt, true) : '—') + '</td></tr></table>' +
    '<label class="chk" style="margin:12px 0"><input type="checkbox" data-act="waConsent"' + (u.waConsent ? ' checked' : '') + '> Terima notifikasi pekerjaan via WhatsApp' + (c.wa ? '' : ' <span class="small muted">(fitur WA belum diaktifkan perusahaan)</span>') + '</label>' +
    '<div class="row"><button class="btn" data-act="exportMyData">⬇ Unduh data saya</button><button class="btn" data-act="dataRequest">✉ Ajukan permohonan</button><button class="btn" data-act="legalPrivacy">Baca Pemberitahuan Privasi</button><button class="btn" data-act="legalTerms">Baca S&K</button></div><div id="myDsr" class="small" style="margin-top:10px"></div></div>';
}
function loadMyRequests() {
  var el = $('#myDsr'); if (!el) return;
  api('privacy.requests', {}, { silent: true }).then(function (l) { el = $('#myDsr'); if (!el) return; var mine = l.filter(function (r) { return r.userId === S.user.id; }); el.innerHTML = mine.length ? '<b>Riwayat permohonan</b>' + mine.map(function (r) { return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9">' + fmtD(r.createdAt, true) + ' · ' + esc(r.type) + ' · <span class="pill ' + (r.status === 'SELESAI' ? 'ok' : r.status === 'DITOLAK' ? 'bad' : 'warn') + '">' + esc(r.status) + '</span>' + (r.response ? '<div class="muted">' + esc(r.response) + '</div>' : '') + '</div>'; }).join('') : ''; }).catch(function () { });
}
/** Tab Privasi & Legal di Administrasi */
function adminPrivacyHtml() {
  var b = S.branding || {};
  setTimeout(function () {
    api('privacy.requests', {}, { silent: true }).then(function (l) {
      var el = $('#dsrList'); if (!el) return;
      el.innerHTML = l.length ? '<div class="tbl-wrap"><table class="t rsp"><thead><tr><th>Tanggal</th><th>Pemohon</th><th>Jenis</th><th>Penjelasan</th><th>Status</th><th></th></tr></thead><tbody>' + l.map(function (r) { var due = r.type === 'PENARIKAN' && r.status !== 'SELESAI' && (Date.now() - new Date(r.createdAt).getTime()) > 48 * 36e5; return '<tr><td data-l="Tanggal" class="small">' + fmtD(r.createdAt, true) + (due ? ' <span class="pill bad">mendekati 3×24 jam</span>' : '') + '</td><td data-l="Pemohon">' + esc(r.userName) + '</td><td data-l="Jenis">' + esc(r.type) + '</td><td data-l="Penjelasan" class="small">' + esc(r.detail) + (r.response ? '<div class="muted">↳ ' + esc(r.response) + ' — ' + esc(r.handledBy) + '</div>' : '') + '</td><td data-l="Status"><span class="pill ' + (r.status === 'SELESAI' ? 'ok' : r.status === 'DITOLAK' ? 'bad' : 'warn') + '">' + esc(r.status) + '</span></td><td class="act">' + (r.status === 'SELESAI' || r.status === 'DITOLAK' ? '' : '<button class="btn s p" data-act="dsrResolve" data-id="' + r.id + '">Tindak lanjut</button>') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Belum ada permohonan.</div>';
    }).catch(fail);
  }, 0);
  return '<div class="grid g2"><div class="card" id="privSet"><h3>Data pengendali & kontak privasi</h3><p class="small muted">Ditampilkan otomatis di Pemberitahuan Privasi dan Syarat & Ketentuan. Nama pengendali = nama perusahaan di Branding.</p><div class="grid"><label class="f">Alamat pengendali (kantor)<input class="i" name="controllerAddress" value="' + esc(b.controllerAddress || '') + '"></label><label class="f">Nama PPDP / DPO (bila ada)<input class="i" name="dpoName" value="' + esc(b.dpoName || '') + '"></label><label class="f">Email privasi<input class="i" type="email" name="privacyEmail" value="' + esc(b.privacyEmail || '') + '"></label><label class="f">Telepon/WA privasi<input class="i" name="privacyPhone" value="' + esc(b.privacyPhone || '') + '"></label><label class="f">Masa retensi data (tahun)<input class="i" type="number" min="1" max="30" name="retentionYears" value="' + esc(b.retentionYears || 5) + '"></label><button class="btn p" data-act="savePrivacySettings">Simpan</button></div></div>' +
    '<div class="card"><h3>Dokumen</h3><p class="small">Versi ketentuan aktif: <b>' + esc(legalCtx().ver) + '</b>. Mengubah isi dokumen (di kode) dan menaikkan <span class="mono">LEGAL_VERSION</span> di Code.gs akan meminta semua pengguna menyetujui ulang.</p><div class="row"><button class="btn" data-act="legalTerms">📄 Syarat & Ketentuan</button><button class="btn" data-act="legalPrivacy">🔒 Pemberitahuan Privasi</button></div><div class="alert warn small" style="margin-top:10px">Dokumen ini adalah templat yang disusun mengikuti UU 27/2022 dan PP 33/2026. Mintalah legal/PPDP perusahaan untuk meninjau sebelum digunakan resmi.</div></div></div>' +
    '<div class="card" style="margin-top:14px"><h3>Permohonan hak subjek data</h3><div id="dsrList"><span class="spin dk"></span></div></div>';
}

/* Tambahkan bagian privasi ke halaman Profil */
(function () { var base = VIEWS.profile; VIEWS.profile = function () { base(); $('#main').insertAdjacentHTML('beforeend', profilePrivacyHtml()); loadMyRequests(); }; })();

      '<div class="dp-grid">' + DM.users.map(function (u) { return '<button type="button" class="dp-u" data-act="demoLogin" data-u="' + u[0] + '"><span class="ic">' + (ICON[u[0]] || '👤') + '</span><span><b>' + esc(u[1]) + '</b><small>' + esc(u[2]) + '</small></span></button>'; }).join('') + '</div>' +
      '<p class="small muted" style="margin:8px 0 0">Data contoh tersimpan hanya di browser ini, tidak dikirim ke server. <a href="#" data-act="demoReset">Reset data demo</a></p>';
    card.insertBefore(box, $('#loginForm', card));
  };
  ACT.demoLogin = function (el) { var f = $('#loginForm'); $('[name=username]', f).value = el.getAttribute('data-u'); $('[name=password]', f).value = DM.password; f.requestSubmit ? f.requestSubmit() : $('#loginBtn').click(); };
  ACT.demoReset = function () { confirmBox('Hapus semua perubahan dan buat ulang data demo dari awal?', function () { DM.reset(); }); };
  ACT.demoInfo = function () {
    modal('Mode Demo', '<p>Anda memakai <b>versi demo</b> LSU Enterprise Platform. Kode server Google Apps Script yang sama dijalankan langsung di browser. "Spreadsheet" contoh disimpan di perangkat ini saja.</p><ul class="small"><li>Masuk sebagai: <b>' + esc((S.user || {}).fullName || '-') + '</b> (' + esc((S.user || {}).roleLabel || (S.user || {}).role || '') + ')</li><li>Coba peran lain untuk melihat alur kerja dan persetujuan berjenjang.</li><li>Foto yang diunggah tersimpan di browser (bukan Google Drive). WhatsApp & lisensi disimulasikan.</li></ul>',
      [{ label: 'Reset data demo', cls: 'w', onClick: function () { ACT.demoReset(); } }, { label: 'Ganti peran', onClick: function () { logout(); } }, { label: 'Tutup', cls: 'p' }]);
  };
  var _sa = startApp;
  startApp = function () { _sa.apply(this, arguments); if (!$('#demoPill')) { var p = document.createElement('button'); p.id = 'demoPill'; p.className = 'demo-pill'; p.setAttribute('data-act', 'demoInfo'); p.innerHTML = '🧪 DEMO'; document.body.appendChild(p); } };
  var _lo = logoutLocal;
  logoutLocal = function () { var p = $('#demoPill'); if (p) p.remove(); _lo(); };
})();

document.addEventListener('DOMContentLoaded', boot);
