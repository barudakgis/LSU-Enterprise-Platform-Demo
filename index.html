<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" crossorigin="anonymous" defer></script>
<style>
:root{--pri:#064e3b;--pri2:#047857;--pri3:#d1fae5;--acc:#d97706;--bg:#f1f5f4;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--r:12px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hide{display:none!important}
/* ---------- Login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#0f766e 0,transparent 60%),linear-gradient(160deg,var(--pri) 0,#022c22 100%)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:18px}
.login-brand img,.login-brand .logo-ph{width:84px;height:84px;border-radius:20px;object-fit:contain;background:var(--pri3);cursor:zoom-in}
.login-brand h1{font-size:20px;margin:6px 0 0}
.login-brand p{margin:0;color:var(--mut);font-size:13px}
.login-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--mut)}
/* ---------- Shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
#topwrap{position:sticky;top:0;z-index:900}
header.top{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img,.brand .logo-ph{width:38px;height:38px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.14);cursor:zoom-in;flex:none}
.logo-ph{display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .tt{min-width:0}
.brand .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.brand .t2{font-size:11.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-pen{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px;max-width:190px}
.top select option{color:#0f172a}
.net{font-size:11px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap;cursor:pointer;border:0;color:#fff}
.net.off{background:#b45309}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:2px solid rgba(255,255,255,.6);flex:none}
.layout{flex:1;display:flex;min-height:0}
nav.side{width:224px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:101px;height:calc(100vh - 101px);overflow:auto}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;color:#334155}
nav.side button:hover{background:#f1f5f9}
nav.side button.on{background:var(--pri3);color:var(--pri);font-weight:600}
nav.side .ico,.bnav .ico{font-size:17px;width:22px;text-align:center}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
main{flex:1;min-width:0;padding:18px;max-width:1280px;width:100%;margin:0 auto}
.bnav{display:none}
.badge-dot{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:auto}
/* ---------- Komponen ---------- */
h2.pg{font-size:20px;margin:0 0 4px}
.pg-sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:700;color:var(--pri)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .s{font-size:11.5px;color:var(--mut)}

.agro-chart{position:relative}.agro-chart svg{display:block;overflow:visible}
.agro-ph{display:flex;align-items:center;justify-content:center;gap:8px;min-height:160px;color:var(--mut);font-size:13px;text-align:center;padding:10px}
.agro-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mut);margin:6px 0 2px}
.agro-leg span{display:inline-flex;align-items:center;gap:5px}.agro-leg i{display:inline-block;width:14px;height:8px;border-radius:2px}
.agro-leg i.dash{height:0;border-top:2px dashed;border-radius:0}.agro-leg i.dia{width:8px;height:8px;background:#0f172a;transform:rotate(45deg);border-radius:1px}
.agro-list{margin-top:8px;border-top:1px solid #f1f5f9}
.agro-li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.agro-li .when{font-weight:600;white-space:nowrap}.agro-li .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agro-li.late .when{color:var(--bad)}
.agro-sm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ag-cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;min-width:0}
.ag-ct{display:flex;align-items:baseline;gap:6px}.ag-ct b{font-size:15px}.ag-v{font-weight:600}.ag-v small{color:var(--mut);font-weight:400}
.ag-dot{width:10px;height:10px;border-radius:50%;margin-left:auto;align-self:center}
.ag-d{font-size:11.5px;font-weight:700;white-space:nowrap}.ag-d.bad{color:var(--bad)}.ag-d.ok{color:var(--ok)}
.ag-spark{min-height:58px}.ag-cf{margin-top:2px}
.ag-grid line{stroke:#e2e8f0}.ag-grid text,.ag-ax text{fill:#64748b;font-size:10.5px}.ag-ax .domain,.ag-ax line{stroke:#cbd5e1}
.ag-target{stroke:#0f172a;stroke-width:1.3;stroke-dasharray:5 4}.ag-plan{fill:none;stroke:#d97706;stroke-width:2;stroke-dasharray:6 4}
.ag-area{fill:rgba(22,163,74,.14)}.ag-act{fill:none;stroke:#16a34a;stroke-width:2.4}.ag-actdot{fill:#16a34a;stroke:#fff;stroke-width:2}
.ag-today{stroke:#b91c1c;stroke-width:1.2;stroke-dasharray:2 3}.ag-rule{stroke:#334155;stroke-width:1}
.ag-lbl{font-size:10.5px;fill:#334155}.ag-lbl.plan{fill:#b45309}.ag-lbl.act{fill:#15803d;font-weight:700}.ag-lbl.today{fill:#b91c1c}
.ag-empty{font-size:12px;fill:#94a3b8}.ag-rl{font-size:11px;fill:#0f172a;font-weight:600}
.ag-bar.proj{stroke-dasharray:4 3;stroke-width:1.2}.ag-bar.plan.late{stroke:#7f1d1d}.ag-dia{fill:#0f172a}.ag-row:hover .ag-band{fill:#ecfdf5}
.ag-opt{stroke:#16a34a;stroke-width:.8;stroke-dasharray:3 3}.ag-tl{fill:none;stroke:#0f172a;stroke-width:1.6}.ag-yl{font-size:9.5px;fill:#64748b}
.ag-tip{position:fixed;z-index:9999;pointer-events:none;background:#0f172a;color:#f8fafc;font-size:12px;line-height:1.45;padding:7px 9px;border-radius:8px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.agro-badge{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:10px 14px;border-radius:12px;border:1px solid;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.agro-badge .ag-bt{flex:1}.agro-badge .chev{font-size:13px;opacity:.7}
.agro-badge.crit{background:#fef2f2;border-color:#fecaca;color:#991b1b}.agro-badge.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.agro-badge.watch{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}.agro-badge.ok{background:var(--okbg);border-color:#bbf7d0;color:#166534;cursor:default}
.agro-badge .pulse{width:11px;height:11px;border-radius:50%;background:currentColor;flex:none;position:relative}
.agro-badge.crit .pulse::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;animation:agp 1.6s ease-out infinite}
@keyframes agp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.agro-badge.crit .pulse::after{animation:none}}
.agro-alerts{margin:-4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.aa-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.aa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:10px}
.aa-card{border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:10px;padding:10px 12px;min-width:0}
.aa-card.sev-crit{border-left-color:var(--bad)}.aa-card.sev-warn{border-left-color:#d97706}.aa-card.sev-watch{border-left-color:var(--info)}
.aa-top{display:flex;gap:9px;align-items:flex-start}.aa-top .sp{min-width:0}
.aa-nut{flex:none;width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.aa-val{margin:8px 0 2px;font-size:13px}.aa-val .v{font-size:20px;font-weight:800}
@media (max-width:1024px){.agro-chips,.agro-sm{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.agro-chip b{font-size:16px}.agro-chip .ic{display:none}.agro-li{grid-template-columns:1fr auto}.agro-li .what{grid-column:1/-1;grid-row:2}.agro-badge{font-size:13px}}
@media (max-width:520px){.ag-ct{flex-wrap:wrap;gap:2px 6px}.ag-v small{display:none}.ag-cell{padding:7px 8px 5px}}

.demo-pick{border:1px dashed #059669;background:#ecfdf5;border-radius:12px;padding:10px;margin-bottom:14px}

.demo-tag{background:#d97706;color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:999px}
.dp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dp-u{display:flex;gap:8px;align-items:center;text-align:left;background:#fff;border:1px solid #a7f3d0;border-radius:10px;padding:7px 9px;font:inherit;color:inherit;cursor:pointer;min-width:0}

// Memo per eksekusi (satu permintaan API = satu eksekusi GAS)
var MEMO_ = {};
var SS_ = null;

function ss_() {
  if (SS_) return SS_;
  var id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');
  SS_ = id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet();
  if (!SS_) throw appError_('NO_SPREADSHEET', 'Spreadsheet database tidak ditemukan. Jalankan setup() dari editor.');
  return SS_;
}

function schemaOk_() {
  if (MEMO_.schemaOk === undefined) MEMO_.schemaOk = PropertiesService.getScriptProperties().getProperty('SCHEMA_VER') === APP_VERSION;
  return MEMO_.schemaOk;
}

/** Migrasi kolom semua sheet sekali per versi aplikasi (bukan setiap request → login lebih cepat) */
function migrateAll_() {
  MEMO_.schemaOk = false;
  Object.keys(SCHEMA).forEach(function (n) { delete MEMO_['S:' + n]; sheet_(n); });
  MEMO_.schemaOk = true;
  try { ensureCompanies_(); } catch (e) { console.warn('ensureCompanies_ ' + e.message); }
  PropertiesService.getScriptProperties().setProperty('SCHEMA_VER', APP_VERSION);
}

function sheet_(name) {
  if (MEMO_['S:' + name]) return MEMO_['S:' + name];
  var cols = Object.keys(SCHEMA[name]);
  var sh = ss_().getSheetByName(name);
  if (!sh) {
    sh = ss_().insertSheet(name);
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#064e3b').setFontColor('#ffffff');
    sh.setFrozenRows(1);
    // Format teks polos agar tanggal ISO / kode tidak dikonversi otomatis oleh Sheets
    sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat('@');
  } else if (!schemaOk_()) {
    // Migrasi ringan: tambah kolom baru bila skema bertambah
    var lastCol = Math.max(sh.getLastColumn(), 1);
    var head = sh.getRange(1, 1, 1, lastCol).getValues()[0];
    var missing = cols.filter(function (c) { return head.indexOf(c) < 0; });
    if (missing.length) {
      sh.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]).setFontWeight('bold');
      sh.getRange(1, lastCol + 1, sh.getMaxRows(), missing.length).setNumberFormat('@');
    }
  }
  MEMO_['S:' + name] = sh;
  return sh;
}

function headers_(name) {
  var key = 'H:' + name;
  if (MEMO_[key]) return MEMO_[key];
  var sh = sheet_(name);
  var h = sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 1)).getValues()[0].map(String);
  MEMO_[key] = h;
  return h;
}

/* ---------- Chunking (batas 50.000 karakter per sel) ---------- */

function chunkIndex_() {
  if (MEMO_.chunks) return MEMO_.chunks;
  var sh = sheet_('_Chunks');
  var map = {};
  var last = sh.getLastRow();
  if (last > 1) {
    var rows = sh.getRange(2, 1, last - 1, 3).getValues();
    rows.forEach(function (r) {
      var k = String(r[0]);
      if (!map[k]) map[k] = [];
      map[k].push({ idx: Number(r[1]), data: String(r[2]) });
    });
  }
  MEMO_.chunks = map;
  return map;
}

function putLarge_(str) {
  var key = Utilities.getUuid();
  var rows = [];
  for (var i = 0, n = 0; i < str.length; i += CHUNK_SIZE, n++) {
    rows.push([key, n, str.substring(i, i + CHUNK_SIZE)]);
  }
  var sh = sheet_('_Chunks');
  sh.getRange(sh.getLastRow() + 1, 1, rows.length, 3).setValues(rows);
  if (MEMO_.chunks) MEMO_.chunks[key] = rows.map(function (r) { return { idx: r[1], data: r[2] }; });
  return CHUNK_PREFIX + key;
}

function getLarge_(ref) {
  var key = String(ref).substring(CHUNK_PREFIX.length);
  var parts = chunkIndex_()[key];
  if (!parts) return '';
  return parts.slice().sort(function (a, b) { return a.idx - b.idx; }).map(function (p) { return p.data; }).join('');
}

function deleteLarge_(ref) {
  if (!ref || String(ref).indexOf(CHUNK_PREFIX) !== 0) return;
  var key = String(ref).substring(CHUNK_PREFIX.length);
  var sh = sheet_('_Chunks');
  var last = sh.getLastRow();
  if (last < 2) return;
  var keys = sh.getRange(2, 1, last - 1, 1).getValues();
  for (var i = keys.length - 1; i >= 0; i--) {
    if (String(keys[i][0]) === key) sh.deleteRow(i + 2);
  }
  if (MEMO_.chunks) delete MEMO_.chunks[key];
}

/** Serialisasi nilai ke sel; string > batas otomatis dipecah */
function toCell_(type, v) {
  if (v === undefined || v === null) return '';
  var out;
  if (type === 'j') out = JSON.stringify(v);
  else if (type === 'b') out = v ? 'TRUE' : 'FALSE';
  else if (type === 'n') out = (v === '' || isNaN(Number(v))) ? '' : String(Number(v));
  else out = String(v);
  // Cegah formula injection dari input pengguna
  if (type === 's' && /^[=+\-@]/.test(out) && !/^-?\d/.test(out)) out = "'" + out;
  if (out.length > CELL_LIMIT - 100) out = putLarge_(out);
  return out;
}

function fromCell_(type, v) {
  if (v === '' || v === null || v === undefined) {
    if (type === 'j') return null;
    if (type === 'b') return false;
    if (type === 'n') return null;
    return '';
  }
  var s = String(v);
  if (s.indexOf(CHUNK_PREFIX) === 0) s = getLarge_(s);
  if (type === 'n') { var num = Number(s); return isNaN(num) ? null : num; }
  if (type === 'b') return s === 'TRUE' || s === 'true' || s === '1' || v === true;
  if (type === 'j') { try { return JSON.parse(s); } catch (e) { return null; } }
  if (s.charAt(0) === "'") s = s.substring(1);
  return s;
}

/* ---------- CRUD generik ---------- */

function all_(name) {
  var key = 'T:' + name;
  if (MEMO_[key]) return MEMO_[key];
  var sh = sheet_(name);
  var head = headers_(name);
  var last = sh.getLastRow();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, head.length).getValues() : [];
  MEMO_[key] = parseRows_(name, head, rows);
  return MEMO_[key];
}

function parseRows_(name, head, rows) {
  var types = SCHEMA[name], list = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i] || [];
    if (r.join('') === '') continue;
    var o = { _row: i + 2, _refs: {} };
    for (var c = 0; c < head.length; c++) {
      var t = types[head[c]];
      if (!t) continue;
      var v = r[c] === undefined ? '' : r[c];
      if (typeof v === 'string' && v.indexOf(CHUNK_PREFIX) === 0) o._refs[head[c]] = v;
      o[head[c]] = fromCell_(t, v);
    }
    list.push(o);
  }
  return list;
}

/**
 * OPTIMASI LOGIN/LOAD: baca banyak sheet dalam SATU panggilan Sheets API (batchGet)
 * alih-alih ±30 panggilan getRange terpisah. Butuh Advanced Service "Sheets" (sudah di appsscript.json).
 * Bila layanan tidak aktif, otomatis kembali ke cara biasa.
 */
function prefetch_(names) {
  try {
    if (typeof Sheets === 'undefined' || !Sheets.Spreadsheets || !Sheets.Spreadsheets.Values) return false;
    var need = names.filter(function (n) { return !MEMO_['T:' + n] && SCHEMA[n]; });
    if (!need.length) return true;
    need.forEach(function (n) { if (!ss_().getSheetByName(n)) sheet_(n); });
    var resp = Sheets.Spreadsheets.Values.batchGet(ss_().getId(), { ranges: need.map(function (n) { return "'" + n + "'!A1:BZ"; }), valueRenderOption: 'FORMATTED_VALUE' });
    (resp.valueRanges || []).forEach(function (vr, i) {
      var n = need[i], rows = vr.values || [];
      var head = (rows[0] || []).map(String);
      MEMO_['H:' + n] = head;
      MEMO_['T:' + n] = parseRows_(n, head, rows.slice(1));
      if (n === '_Chunks') {
        var map = {};
        MEMO_['T:' + n].forEach(function (c) { (map[c.key] = map[c.key] || []).push({ idx: c.idx, data: c.data }); });
        MEMO_.chunks = map;
      }
    });
    return true;
  } catch (e) {
    console.warn('prefetch_ gagal, fallback: ' + e.message);
    return false;
  }
}

function clean_(o) {
  if (!o) return o;
  var c = {};
  Object.keys(o).forEach(function (k) { if (k !== '_row' && k !== '_refs' && k !== 'passHash' && k !== 'salt') c[k] = o[k]; });
  return c;
}

function find_(name, pred) {
  var l = all_(name);
  for (var i = 0; i < l.length; i++) if (pred(l[i])) return l[i];
  return null;
}

function byId_(name, id) {
  return find_(name, function (r) { return r.id === id; });
}

/** Bangun nilai baris; kolom ber-chunk yang tidak berubah memakai referensi lama */
function rowValues_(name, obj, keepRefs) {
  var head = headers_(name);
  var types = SCHEMA[name];
  obj._refs = obj._refs || {};
  return head.map(function (h) {
    if (!types[h]) return '';
    if (keepRefs && obj._refs[h]) return obj._refs[h];
    var v = toCell_(types[h], obj[h]);
    if (v.indexOf(CHUNK_PREFIX) === 0) obj._refs[h] = v;
    return v;
  });
}

function insert_(name, obj) {
  var sh = sheet_(name);
  var list = all_(name); // PERBAIKAN BUG v2.4: baca tabel SEBELUM menulis; bila dibaca sesudahnya, baris baru tercatat dua kali di memori
  var copy = JSON.parse(JSON.stringify(obj));
  delete copy._row; copy._refs = {};
  var vals = rowValues_(name, copy, false);
  var row = sh.getLastRow() + 1;
  sh.getRange(row, 1, 1, vals.length).setValues([vals]);
  copy._row = row;
  list.push(copy);
  return copy;
}

function insertMany_(name, objs) {
  if (!objs.length) return [];
  var sh = sheet_(name);
  var list = all_(name); // lihat insert_
  var start = sh.getLastRow() + 1;
  var copies = objs.map(function (o) { var c = JSON.parse(JSON.stringify(o)); c._refs = {}; return c; });
  var vals = copies.map(function (c) { return rowValues_(name, c, false); });
  sh.getRange(start, 1, vals.length, vals[0].length).setValues(vals);
  return copies.map(function (c, i) { c._row = start + i; list.push(c); return c; });
}

function update_(name, rec, patch) {
  if (!rec || !rec._row) throw appError_('NOT_FOUND', 'Data ' + name + ' tidak ditemukan.');
  rec._refs = rec._refs || {};
  Object.keys(patch).forEach(function (k) {
    rec[k] = patch[k];
    // bersihkan chunk lama bila sel sebelumnya dipecah lalu diubah
    if (rec._refs[k]) { deleteLarge_(rec._refs[k]); delete rec._refs[k]; }
  });
  var vals = rowValues_(name, rec, true);
  sheet_(name).getRange(rec._row, 1, 1, vals.length).setValues([vals]);
  return rec;
}

function deleteRow_(name, rec) {
  if (!rec || !rec._row) return;
  sheet_(name).deleteRow(rec._row);
  delete MEMO_['T:' + name];
}

function nowIso_() { return new Date().toISOString(); }

function newId_(prefix) {
  return prefix + '-' + Utilities.getUuid().replace(/-/g, '').substring(0, 12);
}

function appError_(code, message, status) {
  var e = new Error(message);
  e.code = code;
  e.status = status || 400;
  return e;
}

/* ---------- Media di Google Drive (foto profil, logo, bukti, dokumentasi) ----------
 * Gambar sudah dikompres di perangkat (maks 1280 px JPEG). File disimpan di Drive,
 * sheet HANYA menyimpan URL & ID file → aman dari batas 50.000 karakter per sel.
 */
var IMG_MIME_ = /^image\/(png|jpe?g|webp|gif)$/;

function driveFolder_(sub) {
  var props = PropertiesService.getScriptProperties();
  var root = null, id = props.getProperty('MEDIA_FOLDER_ID');
  if (id) { try { root = DriveApp.getFolderById(id); } catch (e) { root = null; } }
  if (!root) { root = DriveApp.createFolder('LSU Enterprise - Foto Dokumentasi'); props.setProperty('MEDIA_FOLDER_ID', root.getId()); }
  if (!sub) return root;
  var key = 'FOLDER:' + sub, fid = props.getProperty(key);
  if (fid) { try { return DriveApp.getFolderById(fid); } catch (e) { } }
  var f = root.createFolder(sub);
  props.setProperty(key, f.getId());
  return f;
}

function driveUrl_(id, w) { return id ? 'https://lh3.googleusercontent.com/d/' + id + (w ? '=w' + w : '') : ''; }

/** Unggah dataURL ke Drive → { driveId, url, shared, sizeKb } */
function saveToDrive_(dataUrl, name, sub) {
  var m = /^data:([\w\/+.-]+);base64,(.+)$/.exec(String(dataUrl || ''));
  if (!m) throw appError_('BAD_MEDIA', 'Format berkas gambar tidak valid.');
  if (!IMG_MIME_.test(m[1])) throw appError_('BAD_MEDIA', 'Hanya gambar JPG/PNG/WebP yang diizinkan.');
  var bytes = Utilities.base64Decode(m[2]);
  if (bytes.length > 3 * 1024 * 1024) throw appError_('MEDIA_TOO_LARGE', 'Ukuran gambar maksimal 3 MB setelah kompresi.');
  var file;
  try {
    file = driveFolder_(sub).createFile(Utilities.newBlob(bytes, m[1], String(name || 'foto').replace(/[^\w.\- ]/g, '_').substring(0, 80)));
  } catch (e) { throw appError_('DRIVE_ERROR', 'Gagal mengunggah ke Google Drive: ' + e.message); }
  var shared = false;
  try { file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); shared = true; } catch (e) { /* kebijakan domain melarang berbagi publik → pakai proxy */ }
  var id = file.getId();
  return { driveId: id, url: driveUrl_(id), shared: shared, sizeKb: Math.round(bytes.length / 1024) };
}

/** Proxy (untuk file yang tidak bisa dibagikan publik): kembalikan dataURL */
function driveDataUrl_(id, maxBytes) {
  if (!id) return '';
  try {
    var blob = DriveApp.getFileById(id).getBlob();
    var b = blob.getBytes();
    if (maxBytes && b.length > maxBytes) return '';
    return 'data:' + blob.getContentType() + ';base64,' + Utilities.base64Encode(b);
  } catch (e) { return ''; }
}

function trashDrive_(id) { if (id) { try { DriveApp.getFileById(id).setTrashed(true); } catch (e) { } } }

/* ---------- Cache besar (gzip + dipecah 90 KB) & versi data ---------- */

function dataVer_() {
  if (!MEMO_.dataVer) MEMO_.dataVer = PropertiesService.getScriptProperties().getProperty('DATA_VER') || '0';
  return MEMO_.dataVer;
}
function bumpDataVer_() { MEMO_.dataVer = String(Date.now()); PropertiesService.getScriptProperties().setProperty('DATA_VER', MEMO_.dataVer); }

function cachePutBig_(key, str) {
  try {
    var b64 = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(str, 'application/json')).getBytes());
    if (b64.length > 90000 * 90) return;
    var map = {}, n = 0;
    for (var i = 0; i < b64.length; i += 90000, n++) map[key + ':' + n] = b64.substring(i, i + 90000);
    map[key + ':n'] = String(n);
    CacheService.getScriptCache().putAll(map, 21600);
  } catch (e) { console.warn('cachePutBig_ ' + e.message); }
}
function cacheGetBig_(key) {
  try {
    var c = CacheService.getScriptCache(), n = Number(c.get(key + ':n'));
    if (!n) return null;
    var keys = []; for (var i = 0; i < n; i++) keys.push(key + ':' + i);
    var got = c.getAll(keys), parts = [];
    for (var j = 0; j < n; j++) { if (!got[keys[j]]) return null; parts.push(got[keys[j]]); }
    var blob = Utilities.newBlob(Utilities.base64Decode(parts.join('')), 'application/x-gzip');
    return Utilities.ungzip(blob).getDataAsString();
  } catch (e) { return null; }
}

/* ---------- Settings ---------- */

function getSetting_(key, def) {
  var r = find_('Settings', function (s) { return s.key === key; });
  return r && r.value !== '' ? r.value : def;
}

function setSetting_(key, value, actor) {
  var r = find_('Settings', function (s) { return s.key === key; });
  var v = value === undefined || value === null ? '' : String(value);

var MAX_FAILED = 5;
var LOCK_MINUTES = 15;

  }
  if (u.lockedUntil && new Date(u.lockedUntil).getTime() > Date.now()) {

  }

/* =================== Utilitas Geospasial =================== */

function haversineM_(lng1, lat1, lng2, lat2) {
  var R = 6371008.8, toR = Math.PI / 180;
  var dLat = (lat2 - lat1) * toR, dLng = (lng2 - lng1) * toR;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(a));
}

function pointInRing_(pt, ring) {
  var x = pt[0], y = pt[1], inside = false;
  for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi)) inside = !inside;
  }
  return inside;
}

function polygonsOf_(geom) {
  if (!geom) return [];
  if (geom.type === 'Polygon') return [geom.coordinates];
  if (geom.type === 'MultiPolygon') return geom.coordinates;
  return [];
}

function pointInGeom_(pt, geom) {
  return polygonsOf_(geom).some(function (poly) {
    if (!pointInRing_(pt, poly[0])) return false;
    for (var h = 1; h < poly.length; h++) if (pointInRing_(pt, poly[h])) return false;
    return true;
  });
}

/** Luas geodesik ring (m²) — rumus Chamberlain & Duquette (dipakai Leaflet.draw / Turf) */
function ringAreaM2_(ring) {
  var R = 6378137, toR = Math.PI / 180, area = 0, n = ring.length;
  if (n < 3) return 0;
  for (var i = 0; i < n - 1; i++) {
    var p1 = ring[i], p2 = ring[i + 1];
    area += (p2[0] - p1[0]) * toR * (2 + Math.sin(p1[1] * toR) + Math.sin(p2[1] * toR));
  }
  return Math.abs(area * R * R / 2);
}

function geomAreaHa_(geom) {
  var m2 = 0;
  polygonsOf_(geom).forEach(function (poly) {
    m2 += ringAreaM2_(poly[0]);
    for (var h = 1; h < poly.length; h++) m2 -= ringAreaM2_(poly[h]);
  });
  return Math.round(m2 / 100) / 100;
}

function geomBbox_(geom) {
  var b = [180, 90, -180, -90];
  polygonsOf_(geom).forEach(function (poly) { poly[0].forEach(function (c) { b[0] = Math.min(b[0], c[0]); b[1] = Math.min(b[1], c[1]); b[2] = Math.max(b[2], c[0]); b[3] = Math.max(b[3], c[1]); }); });
  return b;
}

/** Validasi geometri blok (pengganti gisValidator.ts) */
function validateGeom_(geom, label) {
  var issues = [];
  if (!geom || (geom.type !== 'Polygon' && geom.type !== 'MultiPolygon')) {
    issues.push({ severity: 'ERROR', code: 'NOT_POLYGON', message: label + ': geometri harus Polygon/MultiPolygon.' });
    return issues;
  }
  polygonsOf_(geom).forEach(function (poly) {
    var ring = poly[0] || [];
    if (ring.length < 4) issues.push({ severity: 'ERROR', code: 'TOO_FEW_VERTICES', message: label + ': ring poligon minimal 4 titik.' });
    var f = ring[0], l = ring[ring.length - 1];
    if (f && l && (Math.abs(f[0] - l[0]) > 1e-9 || Math.abs(f[1] - l[1]) > 1e-9)) issues.push({ severity: 'ERROR', code: 'RING_NOT_CLOSED', message: label + ': poligon tidak tertutup (titik awal ≠ titik akhir).' });
    ring.forEach(function (c) {
      if (Math.abs(c[0]) > 180 || Math.abs(c[1]) > 90) issues.push({ severity: 'ERROR', code: 'NOT_WGS84', message: label + ': koordinat di luar rentang WGS84 (kemungkinan UTM). Proyeksikan ulang ke EPSG:4326.' });
    });
  });
  // hapus duplikat pesan
  var seen = {};
  return issues.filter(function (i) { var k = i.code; if (seen[k]) return false; seen[k] = 1; return true; });
}

/** Impor GeoJSON FeatureCollection batas blok (dengan laporan validasi) */
function importBlocks_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']);
  requireEstate_(actor, p.estateId);
  var fc = p.geojson;
  if (!fc || fc.type !== 'FeatureCollection' || !Array.isArray(fc.features)) throw appError_('VALIDATION', 'Berkas harus GeoJSON FeatureCollection.');
  if (fc.features.length > 2000) throw appError_('VALIDATION', 'Maksimal 2.000 fitur per impor.');
  var divs = all_('Divisions').filter(function (d) { return d.estateId === p.estateId; });
  var defaultDiv = p.divisionId ? byId_('Divisions', p.divisionId) : divs[0];
  var report = { inserted: 0, updated: 0, skipped: 0, issues: [], totalAreaHa: 0 };
  fc.features.forEach(function (f, idx) {
    var pr = f.properties || {};
    var code = String(pr.code || pr.KODE || pr.BLOK || pr.Blok || pr.block || pr.name || '').trim().toUpperCase();
    var label = 'Fitur #' + (idx + 1) + (code ? ' (' + code + ')' : '');
    if (!code) { report.skipped++; report.issues.push({ severity: 'ERROR', code: 'NO_CODE', message: label + ': properti kode blok (code/KODE/BLOK) kosong.' }); return; }
    var errs = validateGeom_(f.geometry, label);
    report.issues = report.issues.concat(errs);
    if (errs.some(function (e) { return e.severity === 'ERROR'; })) { report.skipped++; return; }
    var divCode = String(pr.division || pr.divisi || pr.AFD || pr.afdeling || '').trim().toUpperCase();
    var div = divs.filter(function (d) { return divCode && (d.code === divCode || d.name.toUpperCase() === divCode); })[0] || defaultDiv;
    if (!div) { report.skipped++; report.issues.push({ severity: 'ERROR', code: 'NO_DIVISION', message: label + ': divisi tidak ditemukan; buat divisi terlebih dahulu.' }); return; }
    var area = geomAreaHa_(f.geometry);
    var declared = Number(pr.areaHa || pr.LUAS || pr.luas || 0);
    if (declared && Math.abs(declared - area) / area > 0.1) report.issues.push({ severity: 'WARNING', code: 'AREA_MISMATCH', message: label + ': luas atribut ' + declared + ' ha berbeda >10% dari luas geometri ' + area + ' ha.' });
    var existing = find_('Blocks', function (b) { return b.divisionId === div.id && b.code === code; });
    var py = Number(pr.plantingYear || pr.TT || pr.tahun_tanam || pr.TAHUN_TANAM) || (existing ? existing.plantingYear : 0);
    if (!py) report.issues.push({ severity: 'WARNING', code: 'NO_PLANTING_YEAR', message: label + ': tahun tanam kosong, isi manual di Master Blok.' });
    var data = { estateId: p.estateId, divisionId: div.id, code: code, plantingYear: py || 2015, seedVariety: pr.seedVariety || pr.varietas || (existing ? existing.seedVariety : ''), areaHa: area, sph: Number(pr.sph || pr.SPH) || (existing ? existing.sph : 136), soilType: pr.soilType || (existing ? existing.soilType : 'Mineral_Ultisol'), topography: pr.topography || (existing ? existing.topography : 'Datar'), boundaryGeoJson: f.geometry, isActive: true, updatedAt: nowIso_() };
    if (existing) { update_('Blocks', existing, data); report.updated++; }
    else { data.id = newId_('blk'); data.createdAt = nowIso_(); insert_('Blocks', data); report.inserted++; }
    report.totalAreaHa += area;
  });
  // deteksi tumpang tindih sederhana (centroid blok di dalam blok lain)
  var blocks = all_('Blocks').filter(function (b) { return b.estateId === p.estateId && b.boundaryGeoJson; });
  blocks.forEach(function (a) {
    var bb = geomBbox_(a.boundaryGeoJson), c = [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2];
    blocks.forEach(function (b) { if (a.id !== b.id && pointInGeom_(c, b.boundaryGeoJson) && pointInGeom_(c, a.boundaryGeoJson)) report.issues.push({ severity: 'WARNING', code: 'OVERLAP', message: 'Blok ' + a.code + ' kemungkinan tumpang tindih dengan blok ' + b.code + '.' }); });
  });
  report.totalAreaHa = Math.round(report.totalAreaHa * 100) / 100;
  audit_('GIS_BLOCKS_IMPORTED', 'BLOCK', p.estateId, actor, { inserted: report.inserted, updated: report.updated, skipped: report.skipped }, p.estateId);
  return report;
}

/** FITUR BARU: bangkitkan pohon sampel sistematis di dalam poligon blok */
function generateTrees_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY', 'FIELD_SUPERVISOR']);
  var b = byId_('Blocks', p.blockId);
  if (!b) throw appError_('NOT_FOUND', 'Blok tidak ditemukan.');
  requireEstate_(actor, b.estateId);
  if (!b.boundaryGeoJson) throw appError_('NO_GEOMETRY', 'Blok belum memiliki batas poligon. Impor atau gambar batas blok terlebih dahulu.');
  var target = Math.max(5, Math.min(60, Number(p.count) || 25));
  var bb = geomBbox_(b.boundaryGeoJson);
  var latMid = (bb[1] + bb[3]) / 2;
  var mPerDegLat = 110574, mPerDegLng = 111320 * Math.cos(latMid * Math.PI / 180);
  var rowSpacing = 7.8, treeSpacing = 9.0; // jarak tanam segitiga 9 m
  // cari langkah grid agar jumlah titik dalam poligon ≈ target
  var step = Math.sqrt((b.areaHa || geomAreaHa_(b.boundaryGeoJson)) * 10000 / target);
  var pts = [];
  for (var attempt = 0; attempt < 12; attempt++) {
    pts = [];
    var dLat = step / mPerDegLat, dLng = step / mPerDegLng;
    for (var lat = bb[1] + dLat / 2; lat < bb[3]; lat += dLat) {
      for (var lng = bb[0] + dLng / 2; lng < bb[2]; lng += dLng) {
        if (pointInGeom_([lng, lat], b.boundaryGeoJson)) pts.push([lng, lat]);
      }
    }
    if (pts.length >= target && pts.length <= target * 1.25) break;
    step = step * Math.sqrt(pts.length / target || 0.5);
  }
  // ambil merata sejumlah target
  var chosen = [];
  if (pts.length <= target) chosen = pts;
  else for (var i = 0; i < target; i++) chosen.push(pts[Math.floor(i * pts.length / target)]);
  var existing = all_('Trees').filter(function (t) { return t.blockId === b.id && t.isActive; });
  if (existing.length && !p.replace) throw appError_('TREES_EXIST', 'Blok sudah memiliki ' + existing.length + ' pohon sampel. Centang "ganti" untuk membuat ulang.');
  existing.forEach(function (t) { update_('Trees', t, { isActive: false, updatedAt: nowIso_() }); });
  var now = nowIso_();
  var rows = chosen.map(function (c) {
    var rowNo = Math.max(1, Math.round((c[1] - bb[1]) * mPerDegLat / rowSpacing));
    var treeNo = Math.max(1, Math.round((c[0] - bb[0]) * mPerDegLng / treeSpacing));
    return { id: newId_('tree'), blockId: b.id, estateId: b.estateId, rowNumber: rowNo, treeNumber: treeNo, tagCode: 'TR-' + b.code + '-R' + rowNo + '-P' + treeNo, lng: Math.round(c[0] * 1e7) / 1e7, lat: Math.round(c[1] * 1e7) / 1e7, isStandardSampleTree: true, isActive: true, lastSampledYear: null, createdAt: now, updatedAt: now };
  });
  insertMany_('Trees', rows);
  audit_('SAMPLE_TREES_GENERATED', 'BLOCK', b.id, actor, { count: rows.length, replaced: existing.length }, b.estateId);
  return rows.map(clean_);
}

function saveTree_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY', 'FIELD_SUPERVISOR']);
  var b = byId_('Blocks', p.blockId);

  if (!data.rowNumber || !data.treeNumber) throw appError_('VALIDATION', 'Nomor baris dan nomor pokok wajib diisi.');

/* =================== Protokol / SOP (versi terkendali) =================== */

function activeProtocol_() {
  var list = all_('Protocols');
  return list.filter(function (p) { return p.isActive; })[0] || list[list.length - 1] || null;
}

function saveProtocol_(actor, p) {
  requireRole_(actor, ['HEAD_AGRONOMY']);
  var code = String(p.versionCode || '').trim().toUpperCase();
  if (!code) throw appError_('VALIDATION', 'Kode versi SOP wajib diisi.');
  if (find_('Protocols', function (x) { return x.versionCode === code; })) throw appError_('DUPLICATE_VERSION', 'Versi ' + code + ' sudah ada. SOP tidak boleh ditimpa — gunakan kode versi baru.');
  var minT = Number(p.minTreesPerComposite) || 20, maxT = Number(p.maxTreesPerComposite) || 30, tgt = Number(p.treesPerCompositeSample) || 25;
  if (minT > tgt || tgt > maxT) throw appError_('VALIDATION', 'Harus berlaku: minimal ≤ target ≤ maksimal pohon per komposit.');
  var now = nowIso_();
  all_('Protocols').filter(function (x) { return x.isActive; }).forEach(function (x) { update_('Protocols', x, { isActive: false, updatedAt: now }); });
  var r = insert_('Protocols', {
    id: newId_('proto'), versionCode: code, title: p.title || 'SOP Pengambilan Sampel Daun', effectiveDate: p.effectiveDate || now.substring(0, 10),
    targetFrondNumberTM: Number(p.targetFrondNumberTM) || 17, targetFrondNumberTBM: Number(p.targetFrondNumberTBM) || 9, tmMinAgeYears: Number(p.tmMinAgeYears) || 4,
    leafletsPerTree: Number(p.leafletsPerTree) || 4, treesPerCompositeSample: tgt, minTreesPerComposite: minT, maxTreesPerComposite: maxT,
    maxLeadTimeHoursToLab: Number(p.maxLeadTimeHoursToLab) || 48, gpsToleranceMeters: Number(p.gpsToleranceMeters) || 15, minSampleWeightGrams: Number(p.minSampleWeightGrams) || 100,
    isApproved: true, approvedBy: actor.fullName, isActive: true, notes: p.notes || '', createdAt: now, updatedAt: now
  });
  audit_('SOP_PROTOCOL_VERSION_CREATED', 'PROTOCOL_VERSION', r.id, actor, { versionCode: code });
  return clean_(r);
}

/** Kelas umur: TM bila umur ≥ tmMinAgeYears pada tahun target */
function ageClass_(block, year, proto) {
  var age = (year || new Date().getFullYear()) - (block ? block.plantingYear : 0);
  return age >= ((proto && proto.tmMinAgeYears) || 4) ? 'TM' : 'TBM';
}

function expectedFrond_(block, year, proto) {
  proto = proto || activeProtocol_() || {};
  return ageClass_(block, year, proto) === 'TM' ? (proto.targetFrondNumberTM || 17) : (proto.targetFrondNumberTBM || 9);
}

/* =================== Perencanaan LSU =================== */

function saveUnit_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']);
  requireEstate_(actor, p.estateId);
  var ids = Array.isArray(p.blockIds) ? p.blockIds : [];
  if (!ids.length) throw appError_('VALIDATION', 'Pilih minimal 1 blok untuk unit LSU.');
  if (ids.length > 5) throw appError_('VALIDATION', 'Satu unit LSU maksimal 5 blok (SOP: 1-3 blok homogen).');
  var blocks = ids.map(function (id) { var b = byId_('Blocks', id); if (!b || b.estateId !== p.estateId) throw appError_('VALIDATION', 'Blok ' + id + ' tidak valid untuk estate ini.'); return b; });
  var warnings = [];
  var years = blocks.map(function (b) { return b.plantingYear; });
  if (Math.max.apply(null, years) - Math.min.apply(null, years) > 2) warnings.push('Selisih tahun tanam antar blok > 2 tahun — unit kurang homogen.');
  var soils = blocks.map(function (b) { return b.soilType; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
  if (soils.length > 1) warnings.push('Jenis tanah berbeda (' + soils.join(', ') + ') — unit kurang homogen.');
  var area = Math.round(blocks.reduce(function (s, b) { return s + (b.areaHa || 0); }, 0) * 100) / 100;
  if (area < 30 || area > 100) warnings.push('Luas unit ' + area + ' ha di luar rentang SOP 30-100 ha.');
  var yr = Number(p.targetYear) || new Date().getFullYear();
  var est = byId_('Estates', p.estateId);
  var now = nowIso_();
  var data = { estateId: p.estateId, name: p.name || ('Unit LSU ' + blocks.map(function (b) { return b.code; }).join('-')), targetYear: yr, totalAreaHa: area, blockIds: ids, totalTargetTrees: Number(p.totalTargetTrees) || ((activeProtocol_() || {}).treesPerCompositeSample || 25), soilHomogeneity: p.soilHomogeneity || soils.join(', '), updatedAt: now };
  var r;
  if (p.id) { r = byId_('LsuUnits', p.id); update_('LsuUnits', r, data); }
  else {
    var n = all_('LsuUnits').filter(function (u) { return u.estateId === p.estateId && u.targetYear === yr; }).length + 1;
    data.id = newId_('lsu'); data.code = 'LSU-' + yr + '-' + (est ? est.code : 'EST') + '-U' + ('0' + n).slice(-2); data.createdAt = now;
    r = insert_('LsuUnits', data);
  }
  audit_(p.id ? 'LSU_UNIT_UPDATED' : 'LSU_UNIT_CREATED', 'LSU_UNIT', r.id, actor, { code: r.code, blockIds: ids, warnings: warnings }, p.estateId);
  var out = clean_(r); out.warnings = warnings;
  return out;
}

function savePlan_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY', 'FIELD_SUPERVISOR']);
  var unit = byId_('LsuUnits', p.lsuUnitId);
  if (!unit) throw appError_('VALIDATION', 'Unit LSU tidak ditemukan.');
  requireEstate_(actor, unit.estateId);
  var proto = activeProtocol_();
  if (!proto) throw appError_('NO_PROTOCOL', 'Belum ada SOP aktif.');
  if (!p.samplingWindowStart || !p.samplingWindowEnd || p.samplingWindowEnd < p.samplingWindowStart) throw appError_('VALIDATION', 'Jendela waktu sampling tidak valid.');
  var now = nowIso_();
  if (p.id) {
    var ex = byId_('LsuPlans', p.id);
    if (!ex) throw appError_('NOT_FOUND', 'Rencana tidak ditemukan.');
    if (ex.status !== 'DRAFT') throw appError_('INVALID_STATUS', 'Hanya rencana DRAFT yang dapat diubah.');
    update_('LsuPlans', ex, { samplingWindowStart: p.samplingWindowStart, samplingWindowEnd: p.samplingWindowEnd, notes: p.notes || '', updatedAt: now });
    audit_('LSU_PLAN_UPDATED', 'LSU_PLAN', ex.id, actor, { code: ex.code }, ex.estateId);
    return clean_(ex);
  }
  if (find_('LsuPlans', function (x) { return x.lsuUnitId === unit.id && x.targetYear === unit.targetYear && x.status !== 'CANCELLED'; })) throw appError_('DUPLICATE_PLAN', 'Unit ini sudah memiliki rencana aktif untuk tahun ' + unit.targetYear + '.');
  var est = byId_('Estates', unit.estateId);
  var seq = all_('LsuPlans').filter(function (x) { return x.estateId === unit.estateId && x.targetYear === unit.targetYear; }).length + 1;
  var r = insert_('LsuPlans', {
    id: newId_('pln'), estateId: unit.estateId, lsuUnitId: unit.id, protocolVersionId: proto.id, code: 'PLN-' + unit.targetYear + '-' + (est ? est.code : 'EST') + '-' + ('00' + seq).slice(-3),
    targetYear: unit.targetYear, samplingWindowStart: p.samplingWindowStart, samplingWindowEnd: p.samplingWindowEnd, status: 'DRAFT', notes: p.notes || '',
    submittedBy: '', reviewedBy: '', approvedBy: '', rejectionReason: '', createdBy: actor.id, createdAt: now, updatedAt: now
  });
  audit_('LSU_PLAN_CREATED', 'LSU_PLAN', r.id, actor, { code: r.code }, r.estateId);
  return clean_(r);
}

/** Alur: DRAFT → SUBMITTED → REVIEWED (Estate Manager) → APPROVED (Agronomis) → ASSIGNED → IN_PROGRESS → COMPLETED */
function planAction_(actor, p) {
  var plan = byId_('LsuPlans', p.id);
  if (!plan) throw appError_('NOT_FOUND', 'Rencana tidak ditemukan.');
  requireEstate_(actor, plan.estateId);
  var now = nowIso_(), act = p.action, reason = String(p.reason || '').trim();
  function need(st) { if (plan.status !== st) throw appError_('INVALID_STATUS', 'Aksi ini hanya untuk rencana berstatus ' + st + ' (saat ini ' + plan.status + ').'); }
  function approval(level, decision) { insert_('Approvals', { id: newId_('apv'), targetEntityType: 'LSU_PLAN', targetEntityId: plan.id, level: level, approverUserId: actor.id, approverRole: actor.role, decision: decision, reason: reason, decidedAt: now }); }
  if (act === 'submit') {
    requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY', 'FIELD_SUPERVISOR']); need('DRAFT');
    update_('LsuPlans', plan, { status: 'SUBMITTED', submittedBy: actor.id, rejectionReason: '', updatedAt: now });
    notifyRoles_(['ESTATE_MANAGER'], plan.estateId, 'Rencana LSU ' + plan.code + ' diajukan oleh ' + actor.fullName + ' dan menunggu review Estate Manager.');
  } else if (act === 'review' || act === 'reviewReject') {
    requireRole_(actor, ['ESTATE_MANAGER']); need('SUBMITTED');
    if (act === 'reviewReject') { if (!reason) throw appError_('REASON_REQUIRED', 'Alasan penolakan wajib diisi.'); approval('ESTATE_MANAGER_REVIEW', 'REJECTED'); update_('LsuPlans', plan, { status: 'DRAFT', rejectionReason: reason, updatedAt: now }); }
    else { approval('ESTATE_MANAGER_REVIEW', 'APPROVED'); update_('LsuPlans', plan, { status: 'REVIEWED', reviewedBy: actor.id, updatedAt: now }); notifyRoles_(['AGRONOMIST', 'HEAD_AGRONOMY'], plan.estateId, 'Rencana LSU ' + plan.code + ' telah direview Estate Manager dan menunggu persetujuan Agronomis.'); }
  } else if (act === 'approve' || act === 'reject') {
    requireRole_(actor, ['AGRONOMIST', 'HEAD_AGRONOMY']); need('REVIEWED');
    if (act === 'reject') { if (!reason) throw appError_('REASON_REQUIRED', 'Alasan penolakan wajib diisi.'); approval('AGRONOMIST_APPROVAL', 'REJECTED'); update_('LsuPlans', plan, { status: 'DRAFT', rejectionReason: reason, updatedAt: now }); }
    else { approval('AGRONOMIST_APPROVAL', 'APPROVED'); update_('LsuPlans', plan, { status: 'APPROVED', approvedBy: actor.id, updatedAt: now }); }
  } else if (act === 'cancel') {
    requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']);
    if (plan.status === 'COMPLETED' || plan.status === 'CANCELLED') throw appError_('INVALID_STATUS', 'Rencana sudah ' + plan.status + '.');
    if (!reason) throw appError_('REASON_REQUIRED', 'Alasan pembatalan wajib diisi.');
    update_('LsuPlans', plan, { status: 'CANCELLED', rejectionReason: reason, updatedAt: now });
  } else throw appError_('BAD_ACTION', 'Aksi rencana tidak dikenal.');
  audit_('LSU_PLAN_' + act.toUpperCase(), 'LSU_PLAN', plan.id, actor, { code: plan.code, status: plan.status, reason: reason }, plan.estateId);
  return clean_(plan);
}

function assignPlan_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY', 'FIELD_SUPERVISOR']);
  var plan = byId_('LsuPlans', p.lsuPlanId);
  if (!plan) throw appError_('NOT_FOUND', 'Rencana tidak ditemukan.');
  requireEstate_(actor, plan.estateId);
  if (plan.status !== 'APPROVED' && plan.status !== 'ASSIGNED' && plan.status !== 'IN_PROGRESS') throw appError_('INVALID_STATUS', 'Pelanggaran SOP: hanya rencana yang sudah DISETUJUI yang dapat ditugaskan (status: ' + plan.status + ').');
  var sv = byId_('Users', p.surveyorUserId);
  if (!sv || !sv.isActive || (sv.role !== 'SURVEYOR' && sv.role !== 'FIELD_SUPERVISOR')) throw appError_('VALIDATION', 'Petugas harus berperan Surveyor / Mandor yang aktif.');
  if (!canAccessEstate_(sv, plan.estateId)) throw appError_('VALIDATION', 'Petugas ' + sv.fullName + ' tidak memiliki akses ke estate rencana ini.');
  if (find_('Assignments', function (a) { return a.lsuPlanId === plan.id && a.surveyorUserId === sv.id && a.status !== 'VERIFIED'; })) throw appError_('DUPLICATE_ASSIGNMENT', 'Petugas ini sudah memiliki penugasan aktif pada rencana ini.');
  var unit = byId_('LsuUnits', plan.lsuUnitId);
  var now = nowIso_();
  var r = insert_('Assignments', {
    id: newId_('asg'), estateId: plan.estateId, lsuPlanId: plan.id, surveyorUserId: sv.id, supervisorUserId: p.supervisorUserId || actor.id,
    assignedDate: now.substring(0, 10), dueDate: p.dueDate || plan.samplingWindowEnd, status: 'ASSIGNED',
    targetBlocks: (p.targetBlocks && p.targetBlocks.length) ? p.targetBlocks : (unit ? unit.blockIds : []), totalObservedTrees: 0, createdAt: now, updatedAt: now
  });
  if (plan.status === 'APPROVED') update_('LsuPlans', plan, { status: 'ASSIGNED', updatedAt: now });
  audit_('LSU_ASSIGNMENT_CREATED', 'LSU_ASSIGNMENT', r.id, actor, { plan: plan.code, surveyor: sv.fullName }, plan.estateId);
  notifyUser_(sv, 'Anda ditugaskan sampling LSU ' + plan.code + ' (batas ' + r.dueDate + '). Buka aplikasi LSU untuk memulai.');
  return clean_(r);
}

function assignmentStatus_(actor, p) {
  var a = byId_('Assignments', p.id);
  if (!a) throw appError_('NOT_FOUND', 'Penugasan tidak ditemukan.');
  requireEstate_(actor, a.estateId);
  var st = p.status, now = nowIso_();
  var own = a.surveyorUserId === actor.id;
  if (st === 'ACCEPTED') { if (!own) throw appError_('FORBIDDEN', 'Hanya surveyor yang ditugaskan yang dapat menerima tugas.', 403); if (a.status !== 'ASSIGNED') throw appError_('INVALID_STATUS', 'Tugas sudah ' + a.status + '.'); }
  else if (st === 'SUBMITTED') { if (!own && actor.role !== 'SUPER_ADMIN') throw appError_('FORBIDDEN', 'Hanya surveyor yang ditugaskan yang dapat menyerahkan hasil.', 403); if (['ACCEPTED', 'IN_PROGRESS'].indexOf(a.status) < 0) throw appError_('INVALID_STATUS', 'Tugas berstatus ' + a.status + ' belum dapat diserahkan.'); if (!a.totalObservedTrees) throw appError_('NO_OBSERVATION', 'Belum ada observasi pohon tersinkron.'); }
  else if (st === 'VERIFIED') { requireRole_(actor, ['FIELD_SUPERVISOR', 'ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']); if (a.status !== 'SUBMITTED') throw appError_('INVALID_STATUS', 'Hanya tugas SUBMITTED yang dapat diverifikasi.'); if (own) throw appError_('SEGREGATION_OF_DUTY', 'Verifikator harus berbeda dengan surveyor.', 403); }
  else throw appError_('BAD_STATUS', 'Status tidak dikenal.');
  update_('Assignments', a, { status: st, updatedAt: now });
  if (st === 'VERIFIED') {
    var plan = byId_('LsuPlans', a.lsuPlanId);
    var others = all_('Assignments').filter(function (x) { return x.lsuPlanId === a.lsuPlanId; });
    if (plan && others.every(function (x) { return x.status === 'VERIFIED'; })) update_('LsuPlans', plan, { status: 'COMPLETED', updatedAt: now });
  }
  audit_('LSU_ASSIGNMENT_' + st, 'LSU_ASSIGNMENT', a.id, actor, null, a.estateId);
  return clean_(a);
}

/* =================== Survei Lapangan: Sinkron Offline =================== */

var REPLACEMENT_REASONS = ['TREE_DEAD', 'GANODERMA_SEVERE', 'LIGHTNING_DAMAGED', 'STERILE_ABNORMAL', 'INACCESSIBLE_FLOODED'];
var CONDITIONS = ['NORMAL_HEALTHY', 'DEFICIENT_CHLOROSIS', 'DEFICIENT_ORANGE_SPOTTING', 'PEST_OR_DISEASE', 'DEAD_FALLEN', 'LIGHTNING_STRIKE'];

function surveySync_(actor, p) {
  var key = String(p.idempotencyKey || '');
  if (!key) throw appError_('VALIDATION', 'idempotencyKey wajib.');
  var cached = find_('Idempotency', function (x) { return x.key === key; });
  if (cached) { var res = JSON.parse(cached.response); res.fromCache = true; return res; }
  var proto = activeProtocol_() || {};
  var tol = proto.gpsToleranceMeters || 15;
  var visitMap = {}, result = { visits: [], observations: [], rejected: [], fromCache: false };
  var now = nowIso_();
  (p.visits || []).forEach(function (v) {
    var a = byId_('Assignments', v.assignmentId);
    if (!a) { result.rejected.push({ clientId: v.clientId, reason: 'Penugasan tidak ditemukan.' }); return; }
    if (!canAccessEstate_(actor, a.estateId)) { result.rejected.push({ clientId: v.clientId, reason: 'Di luar scope estate.' }); return; }
    if (a.surveyorUserId !== actor.id && ['FIELD_SUPERVISOR', 'ESTATE_MANAGER', 'SUPER_ADMIN'].indexOf(actor.role) < 0) { result.rejected.push({ clientId: v.clientId, reason: 'Bukan penugasan Anda.' }); return; }
    var ex = find_('FieldVisits', function (x) { return x.offlineClientId === v.clientId; });
    if (!ex) ex = insert_('FieldVisits', { id: newId_('vis'), estateId: a.estateId, assignmentId: a.id, offlineClientId: v.clientId, surveyorUserId: actor.id, surveyorName: actor.fullName, visitedAt: v.visitedAt || now, deviceGpsAccuracyMeters: Number(v.gpsAccuracy) || null, batteryLevelPercent: Number(v.battery) || null, syncedAt: now, createdAt: now });
    visitMap[v.clientId] = ex;
    result.visits.push({ clientId: v.clientId, id: ex.id });
  });
  var touchedAssignments = {};
  (p.observations || []).forEach(function (o) {
    try {
      var visit = visitMap[o.visitClientId] || find_('FieldVisits', function (x) { return x.offlineClientId === o.visitClientId || x.id === o.fieldVisitId; });
      if (!visit) throw new Error('Kunjungan lapangan tidak ditemukan.');
      var dup = find_('Observations', function (x) { return x.clientId === o.clientId; });
      if (dup) { result.observations.push({ clientId: o.clientId, id: dup.id, duplicate: true }); return; }
      var tree = byId_('Trees', o.treeId);
      if (!tree) throw new Error('Pohon sampel tidak ditemukan.');
      var block = byId_('Blocks', tree.blockId);
      var leaflets = Number(o.leafletsCollected);
      // PERBAIKAN BUG: versi asli memeriksa > 12 padahal pesan & SOP menyatakan 1-8 helai
      if (!(leaflets >= 1 && leaflets <= 8)) throw new Error('Jumlah anak daun harus 1-8 helai (standar ' + (proto.leafletsPerTree || 4) + ').');
      if (CONDITIONS.indexOf(o.condition) < 0) throw new Error('Kondisi visual tidak valid.');
      if (o.isReplacement && REPLACEMENT_REASONS.indexOf(o.replacementReason) < 0) throw new Error('Pohon pengganti wajib memiliki alasan valid sesuai SOP.');
      var flags = [];
      var year = new Date(o.sampledAt || now).getFullYear();
      var expFrond = expectedFrond_(block, year, proto);
      if (Number(o.frondNumberSampled) !== expFrond) flags.push('FROND_DEVIATION:' + o.frondNumberSampled + '≠' + expFrond);
      if (leaflets !== (proto.leafletsPerTree || 4)) flags.push('LEAFLET_COUNT:' + leaflets);
      var dist = null;
      if (o.lng && o.lat) {
        dist = Math.round(haversineM_(Number(o.lng), Number(o.lat), tree.lng, tree.lat) * 10) / 10;
        if (!o.isReplacement && dist > tol) flags.push('GPS_OUT_OF_TOLERANCE:' + dist + 'm');
        if (block && block.boundaryGeoJson && !pointInGeom_([Number(o.lng), Number(o.lat)], block.boundaryGeoJson)) flags.push('OUTSIDE_BLOCK');
      } else flags.push('NO_GPS');
      if (Number(o.gpsAccuracy) > tol) flags.push('LOW_GPS_ACCURACY:' + o.gpsAccuracy + 'm');
      if (o.isReplacement && !o.photo) flags.push('REPLACEMENT_WITHOUT_PHOTO');
      var ph = o.photo ? saveToDrive_(o.photo, 'obs-' + tree.tagCode + '-' + String(o.sampledAt || now).substring(0, 10) + '.jpg', 'Pengambilan Sampel Daun') : null;
      var rec = insert_('Observations', {
        id: newId_('obs'), estateId: visit.estateId, fieldVisitId: visit.id, clientId: o.clientId, treeId: tree.id, blockId: tree.blockId,
        actualRowNumber: Number(o.actualRowNumber) || tree.rowNumber, actualTreeNumber: Number(o.actualTreeNumber) || tree.treeNumber,
        frondNumberSampled: Number(o.frondNumberSampled), leafletsCollected: leaflets, condition: o.condition, isReplacement: !!o.isReplacement,
        replacementReason: o.isReplacement ? o.replacementReason : 'NONE', originalTreeId: o.isReplacement ? tree.id : '',
        lng: Number(o.lng) || null, lat: Number(o.lat) || null, gpsAccuracyMeters: Number(o.gpsAccuracy) || null, distanceToTreeMeters: dist,
        photoUrl: ph && ph.shared ? ph.url : '', photoDriveId: ph ? ph.driveId : '', notes: String(o.notes || '').substring(0, 1000), deviationFlags: flags, sampledAt: o.sampledAt || now, createdAt: now
      });
      update_('Trees', tree, { lastSampledYear: year, updatedAt: now });
      if (ph) insert_('Photos', { id: newId_('pho'), entityType: 'OBSERVATION', entityId: rec.id, estateId: visit.estateId, divisionId: block ? block.divisionId : '', blockId: tree.blockId, category: o.isReplacement ? 'Pohon Pengganti' : 'Pengambilan Sampel Daun', caption: tree.tagCode + (o.isReplacement ? ' — pengganti: ' + o.replacementReason : '') + (o.notes ? ' — ' + String(o.notes).substring(0, 200) : ''), takenAt: o.sampledAt || now, lat: Number(o.lat) || null, lng: Number(o.lng) || null, url: ph.url, driveId: ph.driveId, shared: ph.shared, sizeKb: ph.sizeKb, uploadedBy: actor.id, uploadedByName: actor.fullName, createdAt: now });
      touchedAssignments[visit.assignmentId] = true;
      result.observations.push({ clientId: o.clientId, id: rec.id, flags: flags });
    } catch (e) {
      result.rejected.push({ clientId: o.clientId, reason: e.message });
    }
  });
  Object.keys(touchedAssignments).forEach(function (aid) {
    var a = byId_('Assignments', aid);
    var visitIds = all_('FieldVisits').filter(function (v) { return v.assignmentId === aid; }).map(function (v) { return v.id; });
    var uniq = {};
    all_('Observations').forEach(function (o) { if (visitIds.indexOf(o.fieldVisitId) >= 0) uniq[o.treeId] = 1; });
    update_('Assignments', a, { totalObservedTrees: Object.keys(uniq).length, status: (a.status === 'ASSIGNED' || a.status === 'ACCEPTED') ? 'IN_PROGRESS' : a.status, updatedAt: now });
    var plan = byId_('LsuPlans', a.lsuPlanId);
    if (plan && plan.status === 'ASSIGNED') update_('LsuPlans', plan, { status: 'IN_PROGRESS', updatedAt: now });
  });
  insert_('Idempotency', { key: key, response: JSON.stringify(result), createdAt: now });
  audit_('OFFLINE_SURVEY_SYNCED', 'FIELD_VISIT', key, actor, { visits: result.visits.length, observations: result.observations.length, rejected: result.rejected.length });
  return result;
}

/* =================== Sampel Komposit & Chain of Custody =================== */

var SAMPLE_FLOW = {
  SAMPLED: ['PACKED'],
  PACKED: ['IN_TRANSIT'],
  IN_TRANSIT: ['RECEIVED_LAB', 'REJECTED_LAB'],
  RECEIVED_LAB: ['IN_PREPARATION', 'REJECTED_LAB'],
  REJECTED_LAB: ['ARCHIVED'],
  IN_PREPARATION: ['ANALYZING'],
  ANALYZING: ['ANALYSIS_COMPLETED'],
  ANALYSIS_COMPLETED: ['ARCHIVED'],
  ARCHIVED: []
};

function generateSamples_(actor, p) {
  requireRole_(actor, ['SURVEYOR', 'FIELD_SUPERVISOR', 'ESTATE_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']);
  var unit = byId_('LsuUnits', p.lsuUnitId);
  if (!unit) throw appError_('NOT_FOUND', 'Unit LSU tidak ditemukan.', 404);
  requireEstate_(actor, unit.estateId);
  var proto = activeProtocol_() || {};
  var minT = proto.minTreesPerComposite || 20, maxT = proto.maxTreesPerComposite || 30, tgt = proto.treesPerCompositeSample || 25;
  var used = {};
  all_('SampleMembers').forEach(function (m) { used[m.treeObservationId] = 1; });
  var obs = all_('Observations').filter(function (o) {
    return unit.blockIds.indexOf(o.blockId) >= 0 && !used[o.id] && new Date(o.sampledAt).getFullYear() === unit.targetYear;
  });
  if (!obs.length) throw appError_('NO_UNASSIGNED_OBSERVATIONS', 'Tidak ada observasi pohon tahun ' + unit.targetYear + ' di unit ' + unit.code + ' yang belum dikelompokkan.');
  if (obs.length < minT && !p.allowUnderMin) throw appError_('INSUFFICIENT_TREES', 'Baru ' + obs.length + ' pohon tersampel. SOP mensyaratkan minimal ' + minT + ' pohon per sampel komposit.');
  // PERBAIKAN BUG: versi asli memotong per 25 sehingga sisa 1-3 pohon jadi sampel komposit tersendiri.
  var k = Math.max(1, Math.round(obs.length / tgt));
  while (obs.length / k > maxT) k++;
  while (k > 1 && obs.length / k < minT) k--;
  var est = byId_('Estates', unit.estateId);
  var firstBlock = byId_('Blocks', unit.blockIds[0]);
  var frond = expectedFrond_(firstBlock, unit.targetYear, proto);
  var existing = all_('Samples').filter(function (s) { return s.lsuUnitId === unit.id; }).length;
  var unitShort = (unit.code.match(/U\d+$/i) || ['U'])[0].toUpperCase();
  var now = nowIso_(), created = [], start = 0;
  obs.sort(function (a, b) { return String(a.sampledAt).localeCompare(String(b.sampledAt)); });
  for (var i = 0; i < k; i++) {
    var size = Math.floor(obs.length / k) + (i < obs.length % k ? 1 : 0);
    var chunk = obs.slice(start, start + size); start += size;
    var num = existing + i + 1;
    var code = 'SMP-' + unit.targetYear + '-' + (est ? est.code : 'EST') + '-' + unitShort + '-C' + ('0' + num).slice(-2);
    var leaflets = chunk.reduce(function (s, o) { return s + (o.leafletsCollected || 0); }, 0);
    var sample = insert_('Samples', {
      id: newId_('smp'), estateId: unit.estateId, lsuUnitId: unit.id, code: code, compositeNumber: num, status: 'SAMPLED', totalConstituentTrees: chunk.length,
      targetFrondNumber: frond, qrBarcodePayload: JSON.stringify({ c: code, u: unit.code, e: est ? est.code : '', y: unit.targetYear, t: chunk.length, f: frond, l: leaflets }),
      weightGrams: null, packagingType: 'Breathable_Kraft_Bag', dispatchNumber: '', dispatchedAt: '', receivedAtLabAt: '', leadTimeHours: null, rejectionReason: '', createdAt: now, updatedAt: now
    });
    insertMany_('SampleMembers', chunk.map(function (o) { return { id: newId_('sm'), sampleId: sample.id, treeObservationId: o.id, leafletsContributed: o.leafletsCollected, createdAt: now }; }));
    custody_(sample, 'FIELD_COLLECTED', actor.fullName, 'Mandor LSU Lapangan', 'Unit ' + unit.code, 'GOOD', 'Komposit ' + chunk.length + ' pohon, ' + leaflets + ' anak daun, pelepah ' + frond + '.', actor);
    created.push(clean_(sample));
  }
  audit_('SAMPLE_COMPOSITE_GENERATED', 'SAMPLE', unit.id, actor, { unit: unit.code, samples: created.map(function (s) { return s.code; }), observations: obs.length }, unit.estateId);
  return created;
}

function custody_(sample, stage, sender, receiver, location, condition, notes, actor) {
  return insert_('Custody', {
    id: newId_('ce'), sampleId: sample.id, stage: stage, senderActorName: sender, receiverActorName: receiver, timestamp: nowIso_(), locationName: location || '',
    sampleIntegrityCondition: condition || 'GOOD', signatureToken: 'SIG-' + actor.id.slice(-6) + '-' + Utilities.getUuid().substring(0, 8).toUpperCase(), notes: notes || '', createdAt: nowIso_()
  });
}

function sampleStatus_(actor, p) {
  var s = byId_('Samples', p.id) || find_('Samples', function (x) { return x.code.toLowerCase() === String(p.id || '').toLowerCase(); });
  if (!s) throw appError_('SAMPLE_NOT_FOUND', 'Sampel tidak ditemukan.', 404);
  requireEstate_(actor, s.estateId);
  var to = p.status;
  if ((SAMPLE_FLOW[s.status] || []).indexOf(to) < 0) throw appError_('INVALID_STATUS_TRANSITION', 'Transisi ' + s.status + ' → ' + to + ' tidak sesuai SOP. Berikutnya yang diizinkan: ' + ((SAMPLE_FLOW[s.status] || []).join(', ') || '-') + '.');
  if (to === 'IN_TRANSIT') throw appError_('USE_DISPATCH', 'Gunakan menu "Kirim ke Lab" (Surat Pengantar / CoC) untuk mengirim sampel.');
  var proto = activeProtocol_() || {};
  var patch = { status: to, updatedAt: nowIso_() }, stage = 'MANDOR_CHECKED', condition = p.condition || 'GOOD', notes = p.notes || '';
  if (to === 'PACKED') {
    requireRole_(actor, ['SURVEYOR', 'FIELD_SUPERVISOR', 'ESTATE_MANAGER']);
    var w = Number(p.weightGrams);
    if (!w || w <= 0) throw appError_('WEIGHT_REQUIRED', 'Berat sampel (gram) wajib diisi saat pengemasan.');
    patch.weightGrams = w;
    if (w < (proto.minSampleWeightGrams || 100)) notes = (notes ? notes + ' ' : '') + '[PERINGATAN] Berat ' + w + ' g < minimum ' + (proto.minSampleWeightGrams || 100) + ' g.';
  } else if (to === 'RECEIVED_LAB' || to === 'REJECTED_LAB') {
    requireRole_(actor, ['LAB_MANAGER', 'LAB_ANALYST']);
    stage = 'LAB_RECEPTION';
    var lead = s.dispatchedAt ? earliestSampledAt_(s) : null;
    if (lead) { patch.leadTimeHours = Math.round((Date.now() - new Date(lead).getTime()) / 36e5 * 10) / 10; }
    patch.receivedAtLabAt = nowIso_();
    if (to === 'REJECTED_LAB') {
      if (!String(p.rejectionReason || '').trim()) throw appError_('REJECTION_REASON_REQUIRED', 'Alasan penolakan wajib diisi.');
      patch.rejectionReason = String(p.rejectionReason).trim(); condition = 'REJECTED'; notes = 'Ditolak: ' + patch.rejectionReason;
    } else if (patch.leadTimeHours > (proto.maxLeadTimeHoursToLab || 48)) {
      notes = (notes ? notes + ' ' : '') + '[PERINGATAN] Lead time ' + patch.leadTimeHours + ' jam melebihi batas SOP ' + (proto.maxLeadTimeHoursToLab || 48) + ' jam.';
    }
  } else if (to === 'IN_PREPARATION' || to === 'ANALYZING' || to === 'ANALYSIS_COMPLETED') {
    requireRole_(actor, ['LAB_MANAGER', 'LAB_ANALYST']); stage = 'LAB_PREPARATION';
  } else if (to === 'ARCHIVED') {
    requireRole_(actor, ['LAB_MANAGER', 'AGRONOMIST', 'HEAD_AGRONOMY']); stage = 'LAB_PREPARATION';
  }
  var prev = s.status;
  update_('Samples', s, patch);
  custody_(s, stage, p.senderName || actor.fullName, (to === 'RECEIVED_LAB' || to === 'REJECTED_LAB') ? actor.fullName : (p.receiverName || 'Mandor / Pengawas LSU'), p.locationName || '', condition, notes || ('Status ' + prev + ' → ' + to), actor);
  audit_('SAMPLE_STATUS_TRANSITION', 'SAMPLE', s.id, actor, { code: s.code, from: prev, to: to, reason: patch.rejectionReason || '' }, s.estateId);
  return clean_(s);
}

function earliestSampledAt_(s) {
  var obsIds = all_('SampleMembers').filter(function (m) { return m.sampleId === s.id; }).map(function (m) { return m.treeObservationId; });
  var t = all_('Observations').filter(function (o) { return obsIds.indexOf(o.id) >= 0; }).map(function (o) { return o.sampledAt; }).sort()[0];
  return t || s.createdAt;
}

function dispatchSamples_(actor, p) {
  requireRole_(actor, ['ESTATE_MANAGER', 'FIELD_SUPERVISOR', 'AGRONOMIST']);
  var ids = p.sampleIds || [];
  if (!ids.length) throw appError_('EMPTY_SAMPLE_LIST', 'Pilih minimal 1 sampel.');
  if (!String(p.courierName || '').trim()) throw appError_('VALIDATION', 'Nama kurir wajib diisi.');
  var samples = ids.map(function (id) {
    var s = byId_('Samples', id) || find_('Samples', function (x) { return x.code === id; });
    if (!s) throw appError_('SAMPLE_NOT_FOUND', 'Sampel ' + id + ' tidak ditemukan.');
    if (s.status !== 'PACKED') throw appError_('INVALID_SAMPLE_STATUS_FOR_DISPATCH', 'Sampel ' + s.code + ' berstatus ' + s.status + '. Hanya sampel PACKED yang dapat dikirim.');
    requireEstate_(actor, s.estateId);
    return s;
  });
  var estIds = samples.map(function (s) { return s.estateId; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
  if (estIds.length > 1) throw appError_('MIXED_ESTATE', 'Satu surat pengantar hanya untuk sampel dari satu estate.');
  var est = byId_('Estates', estIds[0]);
  var now = new Date();
  var ym = Utilities.formatDate(now, 'Asia/Jakarta', 'yyyyMM');
  // PERBAIKAN BUG: versi asli memakai nomor statis "DSP-2026-06-xxx"
  var seq = all_('Dispatches').filter(function (d) { return d.dispatchNumber.indexOf('DSP-' + ym) === 0; }).length + 1;
  var number = 'DSP-' + ym + '-' + (est ? est.code : 'EST') + '-' + ('00' + seq).slice(-3);
  samples.forEach(function (s) {
    update_('Samples', s, { status: 'IN_TRANSIT', dispatchNumber: number, dispatchedAt: now.toISOString(), updatedAt: now.toISOString() });
    custody_(s, 'DISPATCH_COURIER', actor.fullName, p.courierName, 'Kantor ' + (est ? est.name : 'Estate'), 'GOOD', 'Surat pengantar ' + number + ' menuju ' + (p.destinationLab || 'Laboratorium'), actor);
  });
  var d = insert_('Dispatches', {
    id: newId_('dsp'), dispatchNumber: number, estateId: estIds[0], sampleIds: samples.map(function (s) { return s.id; }), sampleCodes: samples.map(function (s) { return s.code; }),
    totalSamples: samples.length, totalConstituentTrees: samples.reduce(function (a, s) { return a + (s.totalConstituentTrees || 0); }, 0),
    courierName: p.courierName, vehiclePlateNumber: p.vehiclePlateNumber || '', destinationLab: p.destinationLab || getSetting_('DEFAULT_LAB', 'Laboratorium Sentral Agronomi'),
    dispatcherName: actor.fullName, dispatchedAt: now.toISOString(), notes: p.notes || ''
  });
  audit_('SAMPLE_DISPATCH_CREATED', 'CHAIN_OF_CUSTODY', number, actor, { samples: d.sampleCodes }, estIds[0]);
  notifyRoles_(['LAB_MANAGER'], estIds[0], 'Kiriman sampel ' + number + ' (' + samples.length + ' sampel) sedang menuju lab. Wajib diterima < ' + ((activeProtocol_() || {}).maxLeadTimeHoursToLab || 48) + ' jam.');
  return clean_(d);
}


/* =================== FITUR BARU: Foto Dokumentasi (Google Drive, sheet hanya URL) =================== */

var PHOTO_CATEGORIES = ['Kondisi Blok', 'Pohon Sampel', 'Pengambilan Sampel Daun', 'Pohon Pengganti', 'Gejala Defisiensi Hara', 'Hama & Penyakit', 'Pengemasan & Label', 'Serah Terima & Pengiriman', 'Preparasi Lab', 'Peralatan & QC Lab', 'Aplikasi Pupuk', 'Gudang Pupuk', 'Infrastruktur & Akses', 'Rapat & Pelatihan', 'Lainnya'];

/** Tentukan estate/divisi/blok dari entitas yang ditautkan agar foto ikut filter PT/Estate/AFD */
function photoContext_(type, id) {
  var c = { estateId: '', divisionId: '', blockId: '' };
  function fromBlock(bid) { var b = byId_('Blocks', bid); if (b) { c.blockId = b.id; c.divisionId = b.divisionId; c.estateId = b.estateId; } }
  function fromUnit(uid) { var u = byId_('LsuUnits', uid); if (u) { c.estateId = u.estateId; if (u.blockIds && u.blockIds.length) fromBlock(u.blockIds[0]); } }

;
/**
 * LSU Enterprise Platform — Laboratorium, QA/QC, Diagnosis Hara,
 * Rekomendasi Pemupukan, Realisasi Pupuk, Anomali & KPI.
 */

/* =================== Ambang Hara (RULE-AGRO-2026.01) ===================
 * PERBAIKAN BUG: versi asli memakai ambang berbeda dari dokumen SOP
 * (mis. N optimum 2.60-2.90 padahal SOP 2.50-2.80) dan tidak punya kelas "Tinggi".
 * Batas: [sangatRendah<, rendah<, optimum≤, tinggi≤] → di atas tinggi = berlebih
 */
var NUTRIENTS = [
  { k: 'N',  f: 'nitrogenPercent',   unit: '%',   acute: 2.20,  low: 2.50,  optHi: 2.80,  hiHi: 3.10 },
  { k: 'P',  f: 'phosphorusPercent', unit: '%',   acute: 0.140, low: 0.160, optHi: 0.190, hiHi: 0.220 },
  { k: 'K',  f: 'potassiumPercent',  unit: '%',   acute: 0.75,  low: 1.00,  optHi: 1.30,  hiHi: 1.60 },
  { k: 'Mg', f: 'magnesiumPercent',  unit: '%',   acute: 0.18,  low: 0.30,  optHi: 0.45,  hiHi: 0.60 },
  { k: 'Ca', f: 'calciumPercent',    unit: '%',   acute: 0.25,  low: 0.50,  optHi: 0.75,  hiHi: 0.95 },
  { k: 'B',  f: 'boronPpm',          unit: 'ppm', acute: 10.0,  low: 15.0,  optHi: 25.0,  hiHi: 40.0 },
  { k: 'Cu', f: 'copperPpm',         unit: 'ppm', acute: 3.0,   low: 5.0,   optHi: 8.0,   hiHi: 12.0 },
  { k: 'Zn', f: 'zincPpm',           unit: 'ppm', acute: 8.0,   low: 12.0,  optHi: 18.0,  hiHi: 25.0 }
];

function classify_(n, v) {
  if (v < n.acute) return 'ACUTE_DEFICIENT';
  if (v < n.low) return 'DEFICIENT';
  if (v <= n.optHi) return 'OPTIMAL';
  if (v <= n.hiHi) return 'HIGH';
  return 'EXCESS';
}

function validateValues_(v) {
  if (!v) throw appError_('VALIDATION', 'Nilai hara wajib diisi.');
  var out = {};
  NUTRIENTS.forEach(function (n) {
    var x = Number(v[n.f]);
    if (!(x > 0)) throw appError_('INVALID_NUTRIENT_VALUES', 'Nilai ' + n.k + ' harus angka positif.');
    // batas kewajaran fisik (salah ketik satuan, mis. ppm dimasukkan sebagai %)
    var max = n.unit === '%' ? 10 : 500;
    if (x > max) throw appError_('INVALID_NUTRIENT_VALUES', 'Nilai ' + n.k + ' = ' + x + ' ' + n.unit + ' tidak wajar. Periksa satuan.');
    out[n.f] = Math.round(x * 10000) / 10000;
  });
  return out;
}

function diagnose_(values) {
  var ev = {}, crit = 0, mod = 0, limiting = [];
  NUTRIENTS.forEach(function (n) {
    var v = Number(values[n.f]);
    var cls = classify_(n, v);
    var ratioToLow = Math.round(v / n.low * 100) / 100;
    ev[n.k] = { analyte: n.k, value: v, unit: n.unit, deficiencyClass: cls, optimalRange: [n.low, n.optHi], ratioToOptimum: ratioToLow };
    if (cls === 'ACUTE_DEFICIENT') crit++;
    if (cls === 'DEFICIENT') mod++;
    if (cls === 'ACUTE_DEFICIENT' || cls === 'DEFICIENT') limiting.push({ k: n.k, r: ratioToLow, cls: cls, v: v, unit: n.unit, low: n.low });
  });
  // PERBAIKAN BUG: versi asli hanya mengisi faktor pembatas bila hara dengan rasio terendah kebetulan defisien
  limiting.sort(function (a, b) { return a.r - b.r; });
  var primary = limiting.length ? (limiting[0].cls === 'ACUTE_DEFICIENT' ? 'Defisiensi akut ' : 'Defisiensi ') + limiting[0].k + ' (' + limiting[0].v + ' ' + limiting[0].unit + ' < ' + limiting[0].low + ')' : 'Status hara optimal';
  var np = Math.round(values.nitrogenPercent / values.phosphorusPercent * 100) / 100;
  var kmg = Math.round(values.potassiumPercent / values.magnesiumPercent * 100) / 100;
  var cab = Math.round(values.calciumPercent * 10000 / values.boronPpm * 10) / 10; // Ca (ppm) / B (ppm)
  var notes = [];
  if (np > 17.5) notes.push('Rasio N/P ' + np + ' > 17,5: defisiensi P relatif / kelebihan N.');
  else if (np < 14) notes.push('Rasio N/P ' + np + ' < 14: kemungkinan defisiensi N relatif.');
  // PERBAIKAN BUG: versi asli memeriksa > 4,5 tetapi menulis "> 4.0" di pesan
  if (kmg > 3.5) notes.push('Rasio K/Mg ' + kmg + ' > 3,5: risiko antagonisme K-Mg (Mg tertekan).');
  else if (kmg < 2.5) notes.push('Rasio K/Mg ' + kmg + ' < 2,5: K relatif rendah terhadap Mg.');
  return {
    evaluations: ev, ratioNP: np, ratioKMg: kmg, ratioCaB: cab, ratioNotes: notes,
    primaryLimitingFactor: primary + (notes.length ? ' · ' + notes[0] : ''),
    statusSummary: crit ? 'CRITICAL_DEFICIENCY' : (mod ? 'MODERATE_DEFICIENCY' : 'OPTIMAL')
  };
}

function createLabOrder_(actor, p) {
  requireRole_(actor, ['LAB_MANAGER']);
  var ids = p.sampleIds || [];

  var samples = ids.map(function (id) {
    var s = byId_('Samples', id);
    if (!s) throw appError_('SAMPLE_NOT_FOUND', 'Sampel ' + id + ' tidak ditemukan.');
    // PERBAIKAN BUG: versi asli tidak memeriksa status & estate sampel
    if (s.status !== 'RECEIVED_LAB') throw appError_('INVALID_STATUS', 'Sampel ' + s.code + ' berstatus ' + s.status + '; hanya sampel RECEIVED_LAB yang dapat masuk order uji.');
    requireEstate_(actor, s.estateId);
    return s;
  });
  var estIds = samples.map(function (s) { return s.estateId; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
  if (estIds.length > 1) throw appError_('MIXED_ESTATE', 'Satu order uji hanya untuk sampel dari satu estate.');
  var yr = new Date().getFullYear();
  var seq = all_('LabOrders').filter(function (o) { return o.orderNumber.indexOf('LBO-' + yr) === 0; }).length + 1;
  var now = nowIso_();
  var order = insert_('LabOrders', {
    id: newId_('lbo'), orderNumber: 'LBO-' + yr + '-' + ('00' + seq).slice(-3), estateId: estIds[0], sampleIds: samples.map(function (s) { return s.id; }), totalSamples: samples.length,
    status: 'IN_TESTING', receivedDate: now, targetCompletionDate: p.targetCompletionDate || new Date(Date.now() + 7 * 864e5).toISOString().substring(0, 10),
    laboratoryName: p.laboratoryName || getSetting_('DEFAULT_LAB', 'Laboratorium Sentral Agronomi'), createdBy: actor.id, createdAt: now, updatedAt: now
  });
  samples.forEach(function (s) {
    update_('Samples', s, { status: 'IN_PREPARATION', updatedAt: now });
    custody_(s, 'LAB_PREPARATION', actor.fullName, 'Analis Preparasi', order.laboratoryName, 'GOOD', 'Masuk order ' + order.orderNumber + ': cuci aquadest, oven 65-70°C 48 jam, giling 1 mm.', actor);
  });
  audit_('LAB_ORDER_CREATED', 'LAB_ORDER', order.id, actor, { orderNumber: order.orderNumber, samples: samples.map(function (s) { return s.code; }) }, estIds[0]);
  return clean_(order);
}

function saveLabResult_(actor, p) {

  var values = validateValues_(p.values);
  var ex = find_('LabResults', function (r) { return r.sampleId === s.id; });
  // PERBAIKAN BUG: versi asli menimpa hasil lama walaupun sudah APPROVED (melanggar aturan "revisi tidak menimpa")
  if (ex && (ex.status === 'APPROVED' || ex.status === 'REVISED')) throw appError_('USE_REVISION', 'Hasil sudah disetujui. Perubahan wajib melalui menu Revisi (tercatat permanen).');
  var order = find_('LabOrders', function (o) { return (o.sampleIds || []).indexOf(s.id) >= 0; });

  var data = { estateId: s.estateId, labOrderId: order ? order.id : '', sampleId: s.id, batchNumber: batch, status: 'ENTERED', values: values, moistureContentPercent: Number(p.moistureContentPercent) || null, testedByAnalystName: actor.fullName, testedByUserId: actor.id, testedAt: p.testedAt || now, updatedAt: now };

function recordQc_(actor, p) {
  requireRole_(actor, ['LAB_MANAGER', 'LAB_ANALYST']);
  var type = p.qcSampleType;
  if (['BLANK', 'DUPLICATE', 'CERTIFIED_REFERENCE_MATERIAL'].indexOf(type) < 0) throw appError_('VALIDATION', 'Jenis QC tidak valid.');
  var exp = Number(p.expectedValue), meas = Number(p.measuredValue);
  if (isNaN(meas)) throw appError_('VALIDATION', 'Nilai terukur wajib diisi.');
  var tol = Number(p.toleranceValue) || (type === 'BLANK' ? 0.005 : 5);
  var dev, ok;
  if (type === 'BLANK') { dev = meas; ok = Math.abs(meas) <= tol; }                         // batas deteksi absolut
  else if (type === 'DUPLICATE') { var mean = (exp + meas) / 2; dev = mean ? Math.abs(exp - meas) / mean * 100 : 0; ok = dev <= tol; } // RPD
  else { if (!exp) throw appError_('VALIDATION', 'Nilai acuan CRM wajib diisi.'); dev = (meas - exp) / exp * 100; ok = Math.abs(dev) <= tol; }
  var r = insert_('QcRecords', { id: newId_('qc'), batchNumber: String(p.batchNumber || '').toUpperCase(), qcSampleType: type, parameterName: p.parameterName || '', expectedValue: exp || 0, measuredValue: meas, toleranceValue: tol, relativeDeviationPercent: Math.round(dev * 100) / 100, isWithinTolerance: ok, recordedBy: actor.fullName, recordedAt: nowIso_() });
  audit_('LAB_QC_RECORDED', 'QC_RECORD', r.id, actor, { batch: r.batchNumber, type: type, ok: ok });
  return clean_(r);
}

/** PERBAIKAN BUG KRITIS: versi asli MEMBUAT nilai CRM/blanko ACAK lalu meluluskan QC (pemalsuan data mutu). */
function verifyQc_(actor, p) {
  requireRole_(actor, ['LAB_MANAGER', 'LAB_ANALYST']);
  var r = byId_('LabResults', p.id);
  if (!r) throw appError_('NOT_FOUND', 'Hasil lab tidak ditemukan.');
  requireEstate_(actor, r.estateId);
  if (r.status !== 'ENTERED') throw appError_('INVALID_STATUS', 'Verifikasi QC hanya untuk hasil berstatus ENTERED.');
  var qc = all_('QcRecords').filter(function (q) { return q.batchNumber === r.batchNumber; });
  var hasCrm = qc.some(function (q) { return q.qcSampleType === 'CERTIFIED_REFERENCE_MATERIAL'; });
  var hasBlank = qc.some(function (q) { return q.qcSampleType === 'BLANK'; });
  if (!hasCrm || !hasBlank) throw appError_('QC_INCOMPLETE', 'Batch ' + r.batchNumber + ' wajib memiliki minimal 1 data CRM dan 1 data Blanko yang diinput analis.');
  var failed = qc.filter(function (q) { return !q.isWithinTolerance; });
  if (failed.length) {
    audit_('LAB_RESULT_QC_FAILED', 'LAB_RESULT', r.id, actor, { batch: r.batchNumber, failed: failed.length }, r.estateId);
    return { result: clean_(r), isQcPassed: false, message: 'QC gagal: ' + failed.length + ' parameter di luar toleransi (' + failed.map(function (q) { return q.qcSampleType + ' ' + q.parameterName; }).join(', ') + '). Lakukan uji ulang.' };
  }
  update_('LabResults', r, { status: 'QC_VERIFIED', updatedAt: nowIso_() });
  audit_('LAB_RESULT_QC_VERIFIED', 'LAB_RESULT', r.id, actor, { batch: r.batchNumber, qcCount: qc.length }, r.estateId);
  return { result: clean_(r), isQcPassed: true, message: 'QC lulus: ' + qc.length + ' data QA/QC batch ' + r.batchNumber + ' dalam toleransi.' };
}

function approveLabResult_(actor, p) {

function unitApprovedResults_(unit) {

function averageValues_(results) {

function anomaliesFor_(unit, values) {
